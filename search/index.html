</footer> </body></html> <script>(function(){const allPosts = [{"slug":"2026-summer-travel-shenzhen-hongkong","body":"上一次去深圳已经是好几年前了，近些年接触到数字游民相关的东西，一直有开港卡的想法。很庆幸能在这个暑假找到有相同想法的朋友一起，于是又去了深圳和香港一趟\n\n所以，流水账记录一下。照片拍得不好，也懒得配图，要是以后有心情再整理，回忆起什么再加什么\n\n---\n\n## Day 1\n\n去程选了火车卧铺，从杭州南到深圳东，历时 17 个小时\n\n我不是火车迷，但出于好奇还是调查了一下这趟车，因为车体很老，在网上看到说整列车都没有电源，但实际上软卧车厢是有的，虽然我没用上\n\n---\n\n## Day 2\n\n车辆夕发朝至，睡得也不算很差\n\n下车之后在路边小店吃了此行的唯一一顿肠粉，非常遗憾没能多吃几次\n\n站在路边打车去酒店，居然打到打表出租，没有网约车，等待期间看到很多电瓶车被抓\n\n订了华强北附近的酒店，距离华强北只有一条马路，入住时间理论上是下午三点，存包在前台，下楼去华强北逛逛\n\n上午很多档口还没开，似乎要到下午 1 点甚至更晚才开，很多档口到 6、7 点又下班关门了，一天只做下午的生意吗\n\n华强北有很多道通的店，道通的行业机真贵\n\n路口还有一个很大的什么低空展，里面除了老掉牙的二手 DJI 就是玩具，这也行\n\n因为很多地方还没开门，没什么好玩的。10 点左右酒店发信息来说可以入住了，就回酒店睡了会\n\n下午想找二手机。其实我前几次来华强北都没去卖二手机的市场，这次查了一下，说是通天地和飞扬都是二手机，其实这么一看又发现早有耳闻了。离酒店也很近，步行前往\n\n二手机市场都以 iPhone 为主，到处都是 iPhone，配件基本上也只有 iPhone 的，其实我想找有 eSIM 的 Pixel 之类，没找到\n\n还有很多迷你手机，价格都在 300 CNY 左右，挺好玩的，不过没买\n\n市场门口站着蹲着很多背包客代淘机，问了一个说找 Pixel 要 400 CNY，带去能买到的市场 200 CNY，呃呃\n\n回收手机的广告都写到 iPhone 20 了，很多配件也有 iPhone 18 款式了\n\n酒店客房正好在顶楼，于是晚上飞了会飞机。深圳无遮挡 1 KM 就掉信号了，最后什么也没拍到，也就飞了这一次，感觉飞机白带了\n\n---\n\n## Day 3\n\n计划到深圳休整一天之后再去香港，就是今天\n\n本来看的是去深圳北上车，后面又发现福田站更近，就买了福田站的票\n\n来回票价都是 68 CNY，其实相比大巴、地铁性价比高多了，高铁速度还更快。去程是拿 12306 积分兑换的\n\n去程选的动感号，港铁独占车型，回程选了复兴号\n\n几乎是全程地下行驶的大号地铁\n\n到香港西九龙站之后，要过 3、4 个闸机，有刷身份证有刷通行证的，步行距离没有想象中长，过关速度也挺快的\n\n过关之后就坐在公共休息区，等 12367 的过关记录 PDF，有记录才能开户\n\n在休息区旁边的店里花 20 HKD 点了 2 个冷掉的包子和一杯橙汁饮料\n\n应该没到 1 个小时记录就刷出来了\n\n众安开得最早，审核最慢，第二天凌晨才下\n\n中行被拒\n\n恒生一开始资金来源勾了虚拟资产，秒拒，第二次没选就过了\n\n象象挺快，20 分钟就下了，用 FPS 入金了 50 HKD。之后在港的小额支付都用的象象 + Apple Pay，很丝滑\n\n汇立审核 2 天后发邮件说地址无法邮寄，被拒\n\n银联卡用 Apple Pay 还要输 PIN，麻烦\n\n之后出站去找吃的，在车站的 7-11 买了罐港版可乐，瓶装的只有无糖的了，但是因为一路上没有看到垃圾桶，罐装的开罐了又不想一直端着，就没喝\n\n坐地铁过维港，才花 10.6 HKD，打车的话隧道费都要 50 HKD\n\n下地铁之后高德随便搜了一下，找到一家华嫂冰室，也没多想就去了，后来才发现好像是网红店\n\n排队很长，不过叫号也挺快的\n\n一份主食一杯饮料，人均居然只花 50+ CNY\n\n顺便把那罐可乐喝了，其实门口有写不能外带饮料，不过我看里面很多人外带了\n\n之前没有喝过白砂糖可乐，味道确实不一样，柔顺很多\n\n吃完饭去打卡，太热不想走所以打车，香港叫车是真的慢，且每次司机都在离上车点很远的地方就点到达，还要走过去找\n\n本来想去皇后大道东的，我看错攻略了，打到皇后大道中了，好吧，也行\n\n帮家里人在路边药店带了两瓶黄道益，59 HKD 一瓶，屈臣氏 69 HKD 一瓶，很多人说路边药妆店的都是假货，我不懂\n\n药妆店也卖可乐，花 10 HKD 又买了一瓶瓶装可乐\n\n去香港的时候不想背我的大包，所以我额外带了一只迪卡侬的小包，朋友也想买，在深圳一直没有机会\n\n走着走着正好看到一家迪卡侬，于是又每人买了一只小包，只要 23 HKD，超级便宜\n\n然后，在皇后大道中乱逛，香港人真的太多了，再加上天气热，非常不适，又没有找到能歇脚的地方\n\n最后找了家星巴克休息，点了杯 32 HKD 的咖啡，和 KFC 的土豆泥差不多大\n\n休息完了，继续行动。还想要打卡金紫荆广场，长江黄河还有黑龙江\n\n叫车前往，到了之后发现全是旅游团和旅游大巴，广场就是一尊紫金花雕像，其实拍完照就没什么好看的了\n\n继续在广场逛，发现可以乘游轮到对岸的星光大道，90 HKD 一位，上船\n\n船上非常晃，我打这段文字的时候都感觉我还在晃\n\n到了对岸，人实在太多，又很热，没有心情继续逛。没看到麦兜，也没看到栏杆上的手掌印，直接坐地铁回高铁站了\n\n不知道怎么回事，我们的手机在深圳和香港定位都疯狂抽搐，搞得好几次多走路\n\n回高铁站之后就继续在休息区坐着，再次路过 7-11，买了瓶港版雪碧，好喝\n\n手机没电了，休息区的墙插是英规的，没有充电头，查了下 3 楼有 Type-C 的充电区，上楼充到了 39%，总算能撑到回去了\n\n充电区在万宁旁边。其实我不知道万宁是什么，我还以为是便利店，结果是药妆店，我一靠近店员就凑上来各种问，吓得我跑了\n\n旁边还有家零食店，想着好不容易来一趟没买什么东西，又进去买了 2 桶乐天考拉饼干。现在边吃边写\n\n最后候车上车，1 楼候车厅人也巨多，只能席地而坐了\n\n上网买的是 OPPO 自带的全球上网，虚拟 SIM，运营商显示红茶移动，不过 IP 被谷歌送台了\n\n10 CNY 一天，10 GB，到最后 3 GB 都没用到，大部分时间都是 4G，网速只有 30 Mbps 左右\n\n中国移动主卡到港后没开流量，显示 CMHK，收短信免费，但备用机上的副卡，也是中国移动的，直接没有信号了\n\n后来在高铁上误操作，开了下流量，马上收到漫游提醒，运营商显示变成 SmarTone\n\n高铁站和地铁站都有 MTR 的 Free WiFi，地铁站每个设备可以用 15 分钟每次，高铁站是 30 分钟，每天每设备可以用 6 次\n\n最后回到深圳，因为酒店没有一口气订完，导致这晚没房了，回酒店拿行李，又去了另外一个酒店，折腾\n\n---\n\n## Day 4\n\n睡到中午，下楼吃饭\n\n退房，回到之前住的那家酒店，因为那家酒店有洗衣机\n\n下午计划去 DJI 的天空之城看看，有限定的周边\n\n本来想着看完之后再找个海边飞一会无人机，所以还把飞机背着，虽然到最后也没飞。飞机也算回到出生点了\n\n打车从福田到南山，有点远\n\nDJI 的周边都很老，都是好几代之前的产品，很贵，冰箱贴要二三十，腾讯 image 就良心多了\n\n最后买了一只 89 CNY 的 MINI CAT，还有一只 29 CNY 的胸针，本来以为是冰箱贴才买的，结果不是\n\n天空之城还有茶室，花店和书店，有些晚了，就没一一看过去，食堂也没去，匆匆打车返回\n\n另外，进办公区要访客码，访客码要内部员工走审批才能拿到，可惜并不认识 DJI 的，所以在闲鱼上问了，报价 400 CNY 一个人\n\n其实办公区也没什么看的，只有一个连接 T1 和 T2 的空中廊桥\n\n---\n\n## Day 5\n\n中午出门，吃顿港餐，人均 100+ CNY，比香港都贵，也不算很好吃\n\n不过算是圆梦了，吃了很久以前刷视频看到的漏奶华，第一口好吃，第二口发腻，第三口想吐，嗯\n\n点了杯冻柠茶，17 CNY，等上菜过程看到店员拿着罐装可乐，我说怎么还有可乐，菜单上都没看到。结果那就是我的冻柠茶，上了一个冰杯和一罐可乐，搞半天还要自己往里倒，早知道下楼去美宜佳买\n\n下午计划去腾讯，好像腾讯每个办公楼 1 楼都有周边店 image，不过还是去了总部企鹅岛\n\nimage 在译作爱马哥\n\n总部有很多 QQ、微信和游戏的周边，游戏周边只看到王者荣耀和洛克王国的\n\n大号企鹅毛绒 36 CNY 一只，小号 16 CNY 一只。小号是 16 CM 的，大号 25 CM，总之比起 DJI 来说价格都很良心\n\n还有超大号的很可爱的企鹅生日毛绒，可惜太大了，还是纸箱包装，实在不方便携带\n\nDJI 的周边不在线上售卖，但腾讯的周边都能在微信小店企鹅小卖部买到，比线下贵一些，还要加邮费\n\n有些东西只有线上有，也有些东西只有线下有\n\n因为没别的地方能逛了，买完周边就返回了\n\n深圳的交通状况实在不算好，一路上司机骂骂咧咧，开得也很震荡\n\n回到酒店已经快要晚上，我觉得好像没在华强北买什么东西，和没来一样，于是又约朋友去华强北逛了一圈\n\n买了一只华强北特产戴森吹风机，120 CNY 的 「顶配」，我问最贵的要多少，老板拿了只带塑封的盒子，当场拆了给我看，阵仗有些吓人。说用的原电机，180 CNY，试了下确实有点意思，不过我最后还是拿了 120 CNY 的，加了 8 CNY 让老板发快递寄回来\n\n不管 180 CNY 还是 120 CNY 的，外壳做工都远没达到原厂水平\n\n朋友的 AirPods Pro 坏了，看了下华强北的耳机，让我惊讶的是价格居然被卷到 200 CNY 以内了，记得前些年还要 300-400 CNY，更早 600-800 CNY\n\n听感还真不差，比起原版降噪稍弱，通透不行\n\n逛到店都差不多关门了，出来往酒店走。看到半空悬停着一架飞机，打开 RID 扫描软件扫半天没扫到，相机放大一看背上好像有 RTK，原来是行业机\n\n不过后来发现 1562AE 芯片的连不上 macOS 27，1571AM 的可以，所以退掉了\n\n---\n\n## Day 6\n\n因为火车卧铺有点牢，返程选了飞机，廉航加上红眼航班，因为浙江台风登陆的缘故还晚点了一个小时\n\n酒店 1 点退房，飞机是凌晨 1 点的，还有 12 个小时要熬，于是又回到华强北走走走，不过确实没什么感兴趣的东西，什么也没买\n\n太累了，在自助按摩椅上按了 20 分钟，巨痛且没什么效果\n\n一直熬到下午，决定先去机场，叫车\n\n定位飘到马路对面，改定位之后司机又去很远的地方调头，高峰期调个头花了半个多小时，在路边等到快神志不清了才坐上车\n\n在安检前坐了会，刷到机场安检后有菠萝油，可惜赶到时已经买完了\n\n大城市就是正规，内外同价，记得北京也是\n\n宝安 T3 也没感觉很大，走了一会到登机口，就一直坐着等登机\n\n登机和起飞倒是没再延迟，在廉航飞机上坐牢一个半小时之后，终于落地杭州\n\n---\n\n## 总结\n\n没算花了多少钱，大概 2000+ CNY\n\n整体还是顺利的，就是预算和时间有限，还有几个想去的地方没去打卡，当作下一次的邀请函吧","data":{"title":"2026 夏深圳和香港游记","pubDate":"2026-08-11T23:35:00.000Z","category":"默认分类"}},{"slug":"my-recent-purchases","body":"似乎最近的每个月都在买东西，买的都还不是小件，花钱爽的同时也有一些罪恶感，那就细数一下自己的罪恶吧\n\n## 佳能 M62\n\n3 月底买了一台佳能 M62，当时有一段时间不知怎么的又开始研究相机\n\n本来是想买索尼的，A7R2，价格只要 4000 多了，不过看网上说 2 代机对焦很烂，3 代机才变好，3 代机又有些超预算了\n\n但是有天突然看到佳能 M62，在爱回收花了 2909 买下，当时这个价格应该比闲鱼还便宜一些，所以没多想就买了\n\n我的上一台相机还是佳能 M1，机缘巧合之下凑到了佳能的初代 M 卡口和末代 M 卡口\n\n不懂相机，也不懂摄影，我是偏向数毛的，我想 M62 的 3250 万像素应该会很好，但实际上并没有那么数毛，可能只有中画幅能满足我的数毛，也许中画幅也不行\n\n配了几支镜头\n\n1. Canon EF-M 18-55mm f/3.5-5.6 IS STM\n2. Canon EF-S 18-135mm f/3.5-5.6 IS STM II\n3. Sigma EF-M 16mm f/1.4 DC DN\n4. Sigma EF-M 56mm f/1.4 DC DN\n\n对比其他卡口，佳能口的镜头要贵出很多，索尼 E 口镜头又多又便宜，后悔\n\n从初代 M 卡口换到末代 M 卡口，虽然相机迭代速度很慢，但是 M62 到现在也绝对算老机器了，感受最明显的就是对焦速度飞快，虽然 M62 也没有新机型上的一些 AI 对焦，再一个是终于有 WiFi 了，可以用手机传照片，但是实际体验很糟，速度很慢，只能传 JPEG\n\n---\n\n## MacBook Air M5\n\n最近叠加国补、教育优惠、以旧换新补贴之后的丐版 16+512 的 MacBook Air M5 很便宜，价格来到 5XXX，淘金币多的人甚至能 5400-5500 拿下，我没有淘金币，最后是 5700 左右购入的\n\n国补加教育优惠的价格应该是 6100，加上以旧换新补贴 200 现金，200 天猫无门槛券，所以最终价格是 5700\n\n以旧换新随便什么都行，主要为了吃 400 的补贴，回收了一把很早之前买的赛睿键盘，按键都双击了，回收价 2 块\n\n很久没有日用 MacBook 了，上一次用还是 MacBook Pro 2017 的时候\n\nApple Silicon 发展很多年了，到目前为止，我用过的所有软件都是 Apple Silicon 原生的，没遇到任何问题\n\n还有，macOS 的破解软件生态比 Windows 好很多\n\n处理简单的工作，一到两天一充，待机基本不耗电，不过我出门的时候还是习惯带上充电器\n\nmacOS 26 的 bug 真的很多\n\n总的来说，外出的时候带着 Air 感觉真的很好，轻便、强大，很值\n\n---\n\n## Potensic ATOM 3\n\n其实早就知道 ATOM 3 的存在，正式发布的时候我只是在等价格\n\n首发购入三电屏控长续航，价格一点也不便宜，3200\n\n比较大的升级是 4K60 录像，5Ghz 图传和长续航电池，其他方面的升级没什么感觉\n\n1/1.3'' 传感器是 OV50H，博坦的调教能力似乎还有些不足，或者是产能不足？依旧只有 50MP JPEG，12MP RAW，拍照写卡还是很慢，还是没有竖拍，俯仰角度还是不够，比较极限的姿态下云台会限位，是因为 DJI Mini 的云台结构有专利吗\n\nATOM 2 的时候很多老用户吐槽不换模具，嗯，ATOM 3 只换了模具，内部所有芯片都没有变化\n\n图传芯片没换，只改了固件或者说一些配置，开放 5Ghz 和 60 帧，5Ghz 在城市里表现比 2.4Ghz 好很多，干扰基本一条直线，60 帧不是很明显，可能是屏控的问题\n\n屏控完全祛魅，RK3568，2+32G eMMC，体验肯定好不到哪去，又卡又烫，后悔没买普控，等二手市场有普控了再买一个\n\n长续航电池不挂 4G 模块的情况下续航在 30 分钟左右，提升不大，但是体感飞行时间比 ATOM 2 要长许多\n\n4G 模块延迟很高，只敢开摄影挡低速飞\n\n总感觉有些配不上这个价格，但是要说这个价格、配置下更好的选择，好像也没有\n\n买都买了，先用着，期待后续 OTA 能解决这些问题吧\n\n博坦已经在招避障相关岗位了，希望不要年内再出一个 3S，让老用户缓一缓\n\n---\n\n吐槽了一下最近买的这些东西，有机会的话再更新","data":{"title":"最近买的一些东西","description":"最近买的相机、MacBook 和无人机","pubDate":"2026-06-03T00:00:00.000Z","category":"默认分类"}},{"slug":"drone-rc-ota-package-reverse","body":"因为新规，无人机推送了新的符合国标的固件，升级固件的时候顺手抓了个包，发现遥控器也有固件升级，之前的分析刚好还差遥控器这最后一块拼图\n\n固件包体结构和无人机本身的差不多，头部 Magic + Metadata 长度 + Metadata (Json) + Chunk N，Chunk 部分有 AES-CBC 加密，不过用无人机包体的 Key 和 IV 解密只能得到一些无意义的低熵乱码，看来密钥有问题\n\n分析 APP，发现下载完固件后并没有在 APP 端作任何解析和解密，而是直接发给遥控器了\n\n那就继续逆向遥控器吧\n\n先明确硬件，依旧是 FCC 送上的拆机图\n\n![image-20260502235229646](./assets/image-20260502235229646.png)\n\n一眼看过去就能看出 4 块区域。顶部的英集芯 IP2315 充电管理；右侧的 STM32 控制充电、按键；左侧则是和 ATOM 2 上差不多的 AR8032 SoC，2 颗 KCT8285HE FEM，还有一个 SPI NAND Flash，AR8032 应该也承担了和手机通讯的部分，想必 STM32 也干不了这个；底部应该是 2 颗 LDO\n\n板子背面 STM32 的部分有 SWD 调试口，又很轻松地把固件读出来了\n\n![readback](./assets/readback.png)\n\n然并卵，STM32 只负责一些 IO 的控制，并不负责 OTA\n\n于是转向 AR8032，想着读一下 SPI NAND 里的东西，然而我的编程器并没有在身边\n\n但是你说得对，RP2040 是由英国树莓派基金会设计推出的一款高性能微控制器芯片，芯片诞生在专为开源硬件打造的嵌入式开发领域，在这里，开发者可借助芯片原生架构，调用双核算力、操控外设接口。用户将扮演创客与开发者的角色，在自由的硬件创作中适配功能不同、拓展多样的开发模块，用它们一起实现智能控制、物联网开发与创意造物 —— 同时，逐步解锁 RP2040 极致性价比与可编程潜力的核心魅力\n\n找到了一个能把 RP2040 当作 SPI 编程器的项目 [opensensor/pico-serprog](https://github.com/opensensor/pico-serprog)\n\n拆下 NAND，焊接，读取。并不怎么轻松地把固件都出来了\n\n丢给 ChatGPT 分析，然后我瘫坐在椅子上被震惊到说不出话来\n\n![image-20260503001355874](./assets/image-20260503001355874.png)\n\n然后就把升级包解密了\n\n升级包也包含 2 个部分，分别是 RC 和 ITG，RC 是 STM32 的升级包，ITG 则是 AR8032 的\n\n最后，然并卵，不过补齐了一块逆向的拼图\n\nATOM 3 要来了，不过新规之下没有那么期待","data":{"title":"某无人机遥控器升级包逆向和解密","pubDate":"2026-05-02T00:00:00.000Z","category":"信息安全"}},{"slug":"matebook-e-go-2023-and-windows-on-arm-review","body":"一直想买一台轻薄、长续航的笔记本，要求不高，能独立处理简单的事务就可以，必要的话也可以用来远程主力电脑\n\n最符合要求的似乎是 MacBook，最近苹果新出了 MacBook Neo\n\n考虑过 Chromebook，Pixelbook Go 2018 的外观真的很喜欢，不过 Chromebook 配列键盘、超低压 CPU、完全没有性价比的二手价格还是劝退了\n\n安卓平板，手上有 OPPO Pad 3 Pro，官方的键盘没有 Fx 功能区，安卓端 UU 远程的键盘输入也有点问题\n\n然后我买了一台骁龙 8cx Gen3 的华为 Matebook E Go 2023\n\n没有用过原生 Windows on ARM 的设备，很早在树莓派 3B 上用过 Windows 10，在魅族 16 和 MIX 2S 上也用过，第三方适配的 Windows on ARM 基本是玩具级别的\n\n于是记录一下 2026 年在 Matebook E Go 2023 的骁龙 8cx Gen3 上使用 Windows on ARM 的体验\n\n---\n\n## 硬件\n\n在闲鱼上花费 1.5K CNY 购得，配置是 16+512 GB\n\n不知道能不能运行 Windows 平台的游戏，也没打算用这个玩游戏，所以 512 GB 大概是够的\n\n拿在手上的感觉是不轻，机身 + 支架 + 键盘，用厨房秤称得重量 1.215 KG，只比 13 寸的 MacBook Air (1.24 KG) 和 Neo (1.23 KG) 轻一点\n\n~~刚才发现这里打错了，于是马上打开休眠的电脑，一分钟就改完了，理想的使用场景~~\n\n不轻，但机身是纯塑料的，塑料磨砂中框质感非常差，寨板都用金属机身\n\n屏幕是 12.6 寸 2.5K 的触摸屏，发现用键盘 + 触屏来操作也不错，尺寸对于 Windows 来说不大不小。有 120 Hz，比 Chromebook 和 MacBook Air 赢太多\n\n触摸屏响应也很不错\n\n没有红外人脸，但有侧边指纹，识别率尚可，比起侧边指纹的手机还要好一些\n\n键盘是普通的 Windows 配列键盘，到手已经油光锃亮，手感和普通笔记本键盘差不多，这篇东西就是在 Matebook E Go 2023 上打出来的。没有背光，没有 Page Up 和 Page Down，打字很不爽\n\n扬声器和摄像头是听响和扫码的水平，话说 Windows 能扫码吗\n\n---\n\n## 软件\n\n机器到手是 Windows 11 23H2 单语言版\n\n在网上搜到开机按 F10 可以进入隐藏分区里的系统恢复功能恢复原厂镜像，一直报错，作罢\n\n重新安装系统，并不是 PE 重装，是系统设置里的 \"重新安装 Windows\"，又下载 25H2 专业版镜像升级到专业版\n\n用 Dism++ 备份了驱动，用 DiskGenius 镜像了隐藏分区备用\n\n常用的软件里，有不少都提供了 Windows ARM 的构建\n\n|       软件        | 架构  | 运行情况 |\n| :---------------: | :---: | :------: |\n|      Python       | ARM64 | 原生支持 |\n|       Java        | ARM64 | 原生支持 |\n| Microsoft VS Code | ARM64 | 原生支持 |\n|  Microsoft Edge   | ARM64 | 原生支持 |\n|       7-Zip       | ARM64 | 原生支持 |\n|      Typora       | ARM64 | 原生支持 |\n|        Git        | ARM64 | 原生支持 |\n|       Tabby       | ARM64 | 原生支持 |\n|  Clash Verge Rev  | ARM64 | 原生支持 |\n|      Office       | ARM64 | 原生支持 |\n\n其实本来不用 Clash Verge Rev，而是 Clash Party，因为 Clash Party 的 Windows ARM 构建会莫名挂掉，不知道是不是 Electron 干的。FlClash、LocalSend 这些基于 Flutter 的软件都没有 Windows ARM 构建\n\n也有一些只能靠转译的\n\n|     软件     | 架构 |      运行情况      |\n| :----------: | :--: | :----------------: |\n|   IDA Pro    | X64  |   正常，动调正常   |\n|    PixPin    | X64  |        正常        |\n| 网易 UU 远程 | X64  | 正常，硬件加速正常 |\n|   Notepad3   | X64  |        正常        |\n\n目前还没有遇到完全不能运行的软件\n\n应该会有很多驱动不兼容，因为 Prism 转译层只能转译用户态程序，不过暂时没有装驱动的需求\n\n---\n\n## 续航\n\n重负载掉电速度比预期得快，低负载符合预期\n\n电池应该也有衰减，毕竟是 2023 年的东西\n\n没用过超极本，比游戏本高到不知道哪里去了\n\n![image-20260315002316453](./assets/image-20260315002316453.png)\n\n---\n\n嗯，好像就是一台普通的电脑，我还挺满意的，想到什么再补充\n\n用这个能进星巴克办公吗","data":{"title":"Matebook E Go 2023 和 WOA 体验","pubDate":"2026-03-14T00:00:00.000Z","category":"默认分类"}},{"slug":"hardware-reverse-engineering","body":"如 [之前的文章](https://azwhikaru.com/posts/potensic-atom2-review/#toc-6) 所说，博坦无人机的充电管家只有 DC 12V 输入，并没有 USB-C，所以如果在外面临时想要给它充电，就会有些麻烦\n\n实际上通过充电管家给电池充电是 8V 2A，用 USB-C 直接给电池充电则是 5V 3A，其实没多大区别，但总觉得充电管家方便一点\n\n博坦并没有第三方厂家愿意做配件，一点也没有，甚至在官方的滤镜出来之前，博坦用户只能爆改大疆的滤镜来用\n\n所以，能不能给博坦做一个第三方的充电管家？那首先要逆向分析电池的协议了\n\n## 0. 确定通讯方式\n\n在 [这个视频](https://www.bilibili.com/video/BV15x4y1t742) 里，有对博坦充电管家的拆解，可以看出所用的主控芯片是 ST STM32G030C8T6，由于输入的是 12V，还有 3 颗降压充电芯片 SouthChip SC8932A\n\n在 [这个视频](https://www.bilibili.com/video/BV15x4y1t742) 里，有对博坦电池的拆解，能够看到电池的引脚定义，虽然拆的是一代的电池，但鉴于电池管家是通用的，我猜电池也是\n\n![image-20260227001057372](./assets/image-20260227001057372.png)\n\n因为有 SC8932A，而 SC8932A 又有 NTC 脚，很难不让人联想 T 脚是 NTC\n\n然而看了半天，好像 T 和 R 都是连到 STM32 的，难道是 STM32 的 ADC 处理温度\n\n用示波器看一下波形\n\n![image-20260227001518844](./assets/image-20260227001518844.png)\n\nT 和 R 都输出标准的方波，像 UART\n\n## 1. 提取固件\n\n因为不想拆电池，所以下面只能从充电管家下手了\n\n在充电管家的 PCB 上能够看到一组很明显的调试接口\n\n![image-20260226234245448](./assets/image-20260226234245448.png)\n\n通过命名和 ST 品牌，判断这是 SWD 调试口\n\n翻出之前做 USB 电流表的时候买的 PWLink2 Lite\n\n![1772120598292](./assets/1772120598292.jpg)\n\nGND 焊盘不知道为什么不上锡，只能把 GND 连到公共点了，然而这个点下面是大面积铺铜，焊着依旧费劲\n\n插上电脑，打开编程器上位机\n\n![PixPin_2026-02-25_22-55-48](./assets/PixPin_2026-02-25_22-55-48.png)\n\n居然没有任何保护，丝滑地读出了 64KB 的固件\n\n## 2. 逆向分析固件\n\n### 0. 准备\n\n然后就是用 IDA 分析了\n\n查阅 [ST 官网](https://www.st.com.cn/zh/microcontrollers-microprocessors/stm32g0-series.html)，STM32G0 是基于 Cortex-M0+ 的，Cortex-M0+ 又是基于 ARMv6-M 的，所以设置架构为 ARMv6-M\n\n![image-20260226235003892](./assets/image-20260226235003892.png)\n\n固件加载进 IDA 之后，还要手动设置 Segments，因为 IDA 分析的是错的\n\nShift + F7 打开 Segments View\n\n![image-20260226235207360](./assets/image-20260226235207360.png)\n\nIDA 已经创建了 3 个 Segment，很遗憾全错\n\n找到 STM32G030 的 Datasheet，再找到其中 Memory Map 部分\n\n![image-20260226235359457](./assets/image-20260226235359457.png)\n\n下面还有外设的映射，这部分是通用的\n\n![image-20260226235830905](./assets/image-20260226235830905.png)\n\n手动创建太麻烦，写个 IDAPython 脚本批量处理\n\n```python\nimport ida_segment\n\ndef create_segments():\n    segments = [\n        (0x00000000, 0x00010000, \"Boot_Memory\", \"CODE\"),\n        (0x08000000, 0x08010000, \"Main_Flash\", \"CODE\"),\n        (0x1FFF0000, 0x1FFF2000, \"System_Memory\", \"CODE\"),\n        (0x1FFF7000, 0x1FFF7400, \"OTP\", \"DATA\"),\n        (0x1FFF7500, 0x1FFF7800, \"Engineering_Bytes\", \"DATA\"),\n        (0x1FFF7800, 0x1FFF7880, \"Option_Bytes\", \"DATA\"),\n        (0x20000000, 0x20002000, \"SRAM\", \"DATA\"),\n\n        (0xE0000000, 0xE0100000, \"Cortex_M0_Plus\", \"PERIPHERAL\"),\n\n        (0x50000000, 0x50000400, \"GPIOA\", \"PERIPHERAL\"),\n        (0x50000400, 0x50000800, \"GPIOB\", \"PERIPHERAL\"),\n        (0x50000800, 0x50000C00, \"GPIOC\", \"PERIPHERAL\"),\n        (0x50000C00, 0x50001000, \"GPIOD\", \"PERIPHERAL\"),\n        (0x50001000, 0x50001400, \"GPIOE\", \"PERIPHERAL\"),\n        (0x50001400, 0x50001800, \"GPIOF\", \"PERIPHERAL\"),\n\n        (0x40020000, 0x40020400, \"DMA1\", \"PERIPHERAL\"),\n        (0x40020400, 0x40020800, \"DMA2\", \"PERIPHERAL\"),\n        (0x40020800, 0x40021000, \"DMAMUX\", \"PERIPHERAL\"),\n        (0x40021000, 0x40021400, \"RCC\", \"PERIPHERAL\"),\n        (0x40021800, 0x40021C00, \"EXTI\", \"PERIPHERAL\"),\n        (0x40022000, 0x40022400, \"FLASH_REG\", \"PERIPHERAL\"),\n        (0x40023000, 0x40023400, \"CRC\", \"PERIPHERAL\"),\n\n        (0x40015800, 0x40015C00, \"DBG\", \"PERIPHERAL\"),\n        (0x40014800, 0x40014C00, \"TIM17\", \"PERIPHERAL\"),\n        (0x40014400, 0x40014800, \"TIM16\", \"PERIPHERAL\"),\n        (0x40014000, 0x40014400, \"TIM15\", \"PERIPHERAL\"),\n        (0x40013C00, 0x40014000, \"USART6\", \"PERIPHERAL\"),\n        (0x40013800, 0x40013C00, \"USART1\", \"PERIPHERAL\"),\n        (0x40013000, 0x40013400, \"SPI1_I2S1\", \"PERIPHERAL\"),\n        (0x40012C00, 0x40013000, \"TIM1\", \"PERIPHERAL\"),\n        (0x40012400, 0x40012800, \"ADC\", \"PERIPHERAL\"),\n        (0x40010080, 0x40010200, \"SYSCFG_ITLINE\", \"PERIPHERAL\"),\n        (0x40010000, 0x40010030, \"SYSCFG\", \"PERIPHERAL\"),\n        (0x4000B000, 0x4000B400, \"TAMP_BKP\", \"PERIPHERAL\"),\n        (0x40008800, 0x40008C00, \"I2C3\", \"PERIPHERAL\"),\n        (0x40007000, 0x40007400, \"PWR\", \"PERIPHERAL\"),\n        (0x40005C00, 0x40006000, \"USB\", \"PERIPHERAL\"),\n        (0x40005800, 0x40005C00, \"I2C2\", \"PERIPHERAL\"),\n        (0x40005400, 0x40005800, \"I2C1\", \"PERIPHERAL\"),\n        (0x40005000, 0x40005400, \"USART5\", \"PERIPHERAL\"),\n        (0x40004C00, 0x40005000, \"USART4\", \"PERIPHERAL\"),\n        (0x40004800, 0x40004C00, \"USART3\", \"PERIPHERAL\"),\n        (0x40004400, 0x40004800, \"USART2\", \"PERIPHERAL\"),\n        (0x40003C00, 0x40004000, \"SPI3\", \"PERIPHERAL\"),\n        (0x40003800, 0x40003C00, \"SPI2\", \"PERIPHERAL\"),\n        (0x40003000, 0x40003400, \"IWDG\", \"PERIPHERAL\"),\n        (0x40002C00, 0x40003000, \"WWDG\", \"PERIPHERAL\"),\n        (0x40002800, 0x40002C00, \"RTC\", \"PERIPHERAL\"),\n        (0x40002000, 0x40002400, \"TIM14\", \"PERIPHERAL\"),\n        (0x40001400, 0x40001800, \"TIM7\", \"PERIPHERAL\"),\n        (0x40001000, 0x40001400, \"TIM6\", \"PERIPHERAL\"),\n        (0x40000800, 0x40000C00, \"TIM4\", \"PERIPHERAL\"),\n        (0x40000400, 0x40000800, \"TIM3\", \"PERIPHERAL\"),\n    ]\n\n    success_count = 0\n    for start, end, name, sclass in segments:\n        if ida_segment.add_segm(0, start, end, name, sclass):\n            print(f\"[+] {name:\u003c16} (0x{start:08X} - 0x{end:08X})\")\n            success_count += 1\n        else:\n            print(f\"[!] {name:\u003c16} (0x{start:08X} - 0x{end:08X})\")\n\n    print(f\"[+] {len(segments)}/{success_count}\")\n\ncreate_segments()\n```\n\n![image-20260226235733827](./assets/image-20260226235733827.png)\n\n然后要导入 SVD，导入 SVD 可以让 IDA Pro 自动把一些内存地址映射为对应的外设寄存器\n\n![image-20260227000451827](./assets/image-20260227000451827.png)\n\n准备完成之后，就可以开始分析代码了\n\n### 1. 代码分析\n\n从 `0x0800004` 的 Reset 开始，一步步跟到 Main 函数\n\n![image-20260227000729401](./assets/image-20260227000729401.png)\n\n```c\nvoid __noreturn sub_80050F8()\n{\n  int v0; // r0\n  int v1; // r0\n  int v2; // r0\n  int v3; // r0\n  int v4; // r0\n  int v5; // r0\n  int v6; // r0\n  int v7; // r0\n  int v8; // r0\n  int v9; // r0\n  int v10; // r0\n\n  v0 = sub_80016E4();\n  v1 = sub_8003AC0(v0);\n  v2 = sub_800332C(v1);\n  sub_80032D8(v2);\n  v3 = sub_8003590(0);\n  sub_8003648(v3);\n  v4 = sub_8001174(20);\n  v5 = sub_80061D8(v4);\n  v6 = sub_800474C(v5);\n  v7 = sub_8005E34(v6);\n  sub_8003898(v7);\n  if ( (dword_40021060 & 0x20000000u) >> 29 )\n  {\n    sub_8005ED0();\n    dword_40021060 |= 0x800000u;\n  }\n  sub_8003560();\n  while ( !sub_80016BC(&dword_20000068) ) // 主循环\n  {\n    if ( (byte_20000008 & 1) != 0 )\n      byte_20000008 = 2 * ((unsigned __int8)byte_20000008 >> 1);\n    if ( (byte_20000008 & 4) != 0 )\n    {\n      byte_20000008 &= ~4u;\n      v8 = sub_8000190();\n      v9 = sub_8004D5C(v8);\n      v10 = sub_8004858(v9);\n      sub_80057A8(v10);\n    }\n    if ( (byte_20000008 & 0x20) != 0 )\n      byte_20000008 &= ~0x20u;\n    if ( (byte_20000008 & 0x40) != 0 )\n    {\n      sub_8006118();\n      byte_20000008 &= ~0x40u;\n    }\n  }\n  sub_8000CD0();\n}\n```\n\n看着很乱，但是能看出大概的结构，`while()` 里面就是主循环了\n\n接下来就是痛苦地重命名符号，各种猜变量和函数是做什么的\n\n```c\nint __fastcall __noreturn main(int argc, const char **argv, const char **envp)\n{\n  int v3; // r0\n  int v4; // r0\n  int v5; // r0\n  int v6; // r0\n  int v7; // r0\n  int v8; // r0\n  int v9; // r0\n  int v10; // r0\n\n  v3 = sub_80016E4();\n  v4 = sub_8003AC0(v3);\n  v5 = sub_800332C(v4);\n  sub_80032D8(v5);\n  v6 = sub_8003590(0);\n  sub_8003648(v6);\n  v7 = sub_8001174(20);\n  v8 = sub_80061D8(v7);\n  v9 = sub_800474C(v8);\n  v10 = sub_8005E34(v9);\n  sub_8003898(v10);\n  if ( (RCC_CSR & 0x20000000u) >> 29 )\n  {\n    sub_8005ED0();\n    RCC_CSR |= 0x800000u;\n  }\n  sub_8003560();\n  while ( !sub_80016BC(&dword_20000068) )       // Main Super Loop\n  {\n    if ( (byte_20000008 & 1) != 0 )\n      byte_20000008 = 2 * ((unsigned __int8)byte_20000008 >> 1);\n    if ( (byte_20000008 & 4) != 0 )\n    {\n      byte_20000008 &= ~4u;\n      Task_Periodic_Battery_Check();\n      Task_LED_Handler();\n    }\n    if ( (byte_20000008 & 0x20) != 0 )\n      byte_20000008 &= ~0x20u;\n    if ( (byte_20000008 & 0x40) != 0 )\n    {\n      sub_8006118();\n      byte_20000008 &= ~0x40u;\n    }\n  }\n  sub_8000CD0();\n}\n```\n\n```c\nint Task_Periodic_Battery_Check()\n{\n  int battery_channel; // r4\n  int uart_tx_buffer_length; // r5\n  int result; // r0\n\n  ++mux_switch_timer;\n  if ( GPIO_ReadPin((int)&GPIOD, 2) || GPIO_ReadPin((int)&GPIOD, 8) )// Check If Channel 0 and 2 are inserted\n  {\n    if ( GPIO_ReadPin((int)&GPIOD, 2) )\n    {\n      mux_switch_timer = 0;\n      mux_flip_flop_state = 0;\n      SwitchUartMux(2);\n    }\n    else\n    {\n      mux_switch_timer = 0;\n      mux_flip_flop_state = 1;\n      SwitchUartMux(0);\n    }\n  }\n  else if ( mux_switch_timer == 250 || (byte_200008B0 || byte_200008D0) && is_uart_occupied == 1 )\n  {\n    is_uart_occupied = 0;\n    mux_switch_timer = 0;\n    byte_200008B0 = 0;\n    byte_200008D0 = 0;\n    if ( mux_flip_flop_state )\n    {\n      mux_flip_flop_state = 0;\n      if ( !GPIO_ReadPin((int)&GPIOD, 8) )\n        SwitchUartMux(2);\n    }\n    else\n    {\n      mux_flip_flop_state = 1;\n      if ( !GPIO_ReadPin((int)&GPIOD, 2) )\n        SwitchUartMux(0);\n    }\n  }\n  for ( battery_channel = 0; battery_channel \u003c 3; battery_channel = (unsigned __int8)(battery_channel + 1) )\n  {\n    uart_tx_buffer[16 * battery_channel] = 0xFF;\n    uart_tx_buffer[16 * battery_channel + 1] = 0xFE;\n    uart_tx_buffer[16 * battery_channel + 2] = 9;\n    uart_tx_buffer[16 * battery_channel + 3] = 0;\n    if ( uart_tx_interval_counter == 20 )\n    {\n      uart_tx_buffer[16 * battery_channel + 4] = 0x98;\n      uart_tx_buffer[16 * battery_channel + 5] = 0;\n      uart_tx_buffer[16 * battery_channel + 6] = 1;\n      uart_tx_buffer[16 * battery_channel + 7] = 0;\n      uart_tx_buffer[16 * battery_channel + 8] = 0;\n      uart_tx_buffer[16 * battery_channel + 9] = 0;\n      uart_tx_buffer[16 * battery_channel + 10] = 0;\n      uart_tx_buffer[16 * battery_channel + 11] = 0;\n      uart_tx_buffer_length = 13;\n    }\n    else\n    {\n      uart_tx_buffer[16 * battery_channel + 4] = 0;\n      uart_tx_buffer_length = 0;\n    }\n    if ( uart_tx_buffer_length )\n    {\n      if ( !battery_channel && !active_uart_channel )\n      {\n        is_uart_occupied = 1;\n        if ( Get_Charge_Enable_Status(0) )\n          uart_tx_buffer[6] |= 0x80u;\n        else\n          uart_tx_buffer[6] &= ~0x80u;\n        uart_tx_buffer[12] = Calculate_Checksum_XOR(&uart_tx_buffer[2], 10);\n        HAL_UART_Transmit_DMA(&huart_ch0_ch3_muxed, (int)uart_tx_buffer, uart_tx_buffer_length);\n      }\n      if ( battery_channel == 2 && ----------- | ------------------------------ |\n| 0      | 帧头 1            | `0xFF`                     | State 0 (loc_8000636)          |\n| 1      | 帧头 2            | `0xFD`                     | State 1 (loc_800065E)          |\n| 2      | 帧头 3            | `0x2D`                     | State 2 (loc_8000680)          |\n| 3      | 帧头 4            | `0x00`                     | State 3 (loc_80006AE)          |\n| 4      | 未知              | `0x98` 或 `0x99` 或 `0x72` | State 4 (loc_80006DC)          |\n| 5      | 固定位            | `0x00`                     | State 5 (loc_8000728)          |\n| 6 ~ 47 | 数据区 (Payload)  | **42 字节的加密数据**      | State 6 (loc_8000750) 循环42次 |\n| 48     | 校验和 (Checksum) | 异或校验和                 | State 7 (loc_8000794)          |\n\n### 5. 解密加密字段\n\n接下来要找到 DES 加密的 Payload 的密钥\n\n根据 ARM 汇编，调用函数时候的参数 `a1`、`a2`、`a3` 分别存在 `R0`、`R1`、`R2`，当前 `R2` 是 `unk_20000040`\n\n![image-20260227025138911](./assets/image-20260227025138911.png)\n\n查找对 `unk_20000040` 的交叉引用\n\n![image-20260227025216630](./assets/image-20260227025216630.png)\n\n```c\nint sub_800474C()\n{\n  return sub_8000B7A(?, &unk_20000040, ?);\n}\n```\n\n```c\nint __fastcall sub_8000B7A(unsigned int *a1, _BYTE *a2, int a3)\n{\n  _DWORD v7[32]; // [sp+0h] [bp-80h] BYREF\n\n  sub_8005454((int)v7);\n  sub_8005794(v7, a3);\n  return DES_Decrypt_Block(v7, a1, a2);\n}\n```\n\n可以发现 DES 的 2 个密钥，根密钥和会话密钥\n\n用此处的密钥就可以解密电池的 Payload 报文了\n\n### 6. 解析加密字段\n\n```python\ndef parse_and_print(dec_data):\n    u = struct.unpack(\">20H\", dec_data)\n    temp_c = round((u[9] / 10.0) - 273.15, 1)\n    curr = struct.unpack(\">h\", struct.pack(\">H\", u[11]))[0]\n    \n    real_device_id = dec_data[35]\n    v_major = dec_data[36] & 0x0F\n    v_minor = dec_data[37] >> 4\n    v_patch = dec_data[37] & 0x0F\n    version_str = f\"{v_major}.{v_minor}.{v_patch}\"\n\n    print(f\"BMS 设备 ID: 0x{real_device_id:02X}\")\n    print(f\"BMS 固件版本: {version_str}\")\n    print(f\"电芯 1 电压: {u[0]} mV\")\n    print(f\"电芯 2 电压: {u[1]} mV\")\n    print(f\"压差: {u[0] - u[1] if u[0] > u[1] else u[1] - u[0]} mV\")\n    print(f\"总电压: {u[12]} mV\")\n    print(f\"当前放电电流: {curr} mA\")\n    print(f\"温度: {temp_c} °C\")\n    print(f\"当前电量: {u[10]} %\")\n    print(f\"当前容量: {u[6]} mAh\")\n    print(f\"满充容量: {u[7]} mAh\")\n    print(f\"循环次数: {u[5]} 次\")\n    print(f\"电池健康度: {u[14]} %\")\n    print(f\"最大充电电流: {u[15]} mA\")\n```\n\n> BMS 设备 ID: 0x76\n> BMS 固件版本: 6.0.4\n> 电芯 1 电压: 4354 mV\n> 电芯 2 电压: 4354 mV\n> 压差: 0 mV\n> 总电压: 8708 mV\n> 当前放电电流: 498 mA\n> 温度: 20.0 °C\n> 当前电量: 96 %\n> 当前容量: 1994 mAh\n> 满充容量: 2071 mAh\n> 循环次数: 12 次\n> 电池健康度: 96 %\n> 最大充电电流: 2230 mA\n\n其中一些字段的含义不太确定，不过大致和无人机端读取的数据差不多","data":{"title":"硬件逆向工程入门","pubDate":"2026-02-26T00:00:00.000Z","category":"信息安全"}},{"slug":"potensic-atom2-review","body":"去年 11 月买的，其实早就想要写这个，一直拖到现在\n\n买无人机的契机是去年发现机房里遗留的一台大疆精灵 3 SE，一冲动花了 300 拿下，又配了 2 块电池组了 3 电，一块电池 150，2 块电池都抵得上机身了，总计 600 元\n\n精灵是记忆中的东西。精灵一出来，所有无人机都变成精灵这样；御的折叠机臂一出现，所有无人机又都变成了折叠机臂，后来了解到精灵还有改折叠机臂的套件，抽象\n\n记得以前校运会有人飞无人机，飞的就是精灵，配文说 \"他的无人机是大疆精灵，比较轻巧\"，那时候无人机也没现在这么流行，是看到都会 \"哇\" 一声的存在\n\n精灵实在太大了，1.3 公斤的起飞重量，要放在一个巨大的双肩包里，精灵 3 SE 的图传表现在今天看也很糟糕，强干扰的地方几十米就会断连，在乡下我也只飞了 1.7 公里\n\n给遥控换电池，[破解 FCC](https://github.com/TryExceptElseFinally/DJIGO_patch)，改平板天线，希望它能够振作一点\n\n精灵的时代过去了，网上资料有些难找，于是就自己乱搞，一通操作下来花了不少钱和精力，收效甚微。精灵 3 SE 现在在吃灰，放几张照片缅怀一下\n\n![1768999458313](./assets/1768999458313.jpg)\n\n![1768999421588](./assets/1768999421588.jpg)\n\n![image-20260121204546237](./assets/image-20260121204546237.png)\n\n精灵 3 SE 吃灰之后，又想买别的飞机。本来我了解得不多，也是觉得 \"大疆之外都是杂牌\" 的那种人。朋友飞过博坦 1 代，跟我说还不错，再加上有天晚上看到京东博坦 2 代刚好有国补，于是就买了博坦 ATOM 2\n\n![Screenshot_2026-01-21-20-51-42-54_4fbb30eb7b7166119bd25e41eddeee2f](./assets/Screenshot_2026-01-21-20-51-42-54_4fbb30eb7b7166119bd25e41eddeee2f.jpg)\n\n3 电池 + 128G 存储卡，据说前一个月 18XX 就能买到，不过我已经很满足了\n\n博坦给我的感觉是惊喜，也打破了 \"大疆之外都是杂牌\" 的观念\n\n下面的所有对比都是和大疆 Mini 4 Pro 的比较，让 ATOM 2 对比售价是它一倍的 Mini 4 Pro 似乎并不合理，只是除了精灵 3 SE，我只飞过 Mini 4 Pro 和 ATOM 2\n\n作为一个尚在起步阶段的小厂，博坦只有 ATOM 一个中低端系列，2025 年发布的 ATOM 2 在规格和堆料上连 2022 年的大疆 Mini 3 Pro 都比不上：只有下 ToF 视觉，没有避障，只有 4K30，1/2 英寸传感器。但是除了这些硬件堆料不足，软件方面博坦给得并不差：Log (虽然我不会调色，感觉不如直出)、竖拍 (虽然是裁切)、航点飞行 (还没用过)，觉得还差一个延时录像就完美了\n\n## APP\n\n博坦的 Potensic Eve 还不错，起码长得很好看\n\n![image-20260121210433236](./assets/image-20260121210433236.png)\n\n![image-20260121210549371](./assets/image-20260121210549371.png)\n\n![image-20260121210656968](./assets/image-20260121210656968.png)\n\nPotensic Eve 的姿态球在风速 >= 4 级的时候还会显示风速和风向，大疆没有的功能\n\n![img](./assets/3129BCD2-2D7C-43F3-A767-3132FBA156FE.jpg)\n\nDJI Fly 会用 AR 显示返航点和返航路线，感觉这个功能还不错，博坦没有\n\n### 飞行数据上传\n\n非常幽默的功能。这个飞行数据上传并不是把飞行数据同步到账号，而是上传到博坦的服务器当作售后分析日志的依据。也就是换台手机，或者重装 APP，飞行数据就全都没有了，那么登录账号功能有什么用呢\n\n![Screenshot_2026-01-21-22-09-34-63_e2a7d7fb1b9bf302e6463a9f12c5b3e7](./assets/Screenshot_2026-01-21-22-09-34-63_e2a7d7fb1b9bf302e6463a9f12c5b3e7.jpg)\n\n### 图传\n\n图传直接影响拉距。对新手来说，飞机拉距和相机长焦差不多，能给人极大的满足感，虽然拍不出什么东西，不过远就是好\n\n图传稳定也能给飞手很多信心，之前飞精灵 3 SE 的时候完全不敢飞远，怕这老东西断图传之后出什么意外\n\nATOM 2 的官方宣称最远距离是 10 公里，大疆 O3 的宣称最远距离是 12 公里，O4 则是 20 公里 (当然都是 FCC)\n\n![image-20260121212019011](./assets/image-20260121212019011.png)\n\n![image-20260121212920171](./assets/image-20260121212920171.png)\n\n![image-20260121212954223](./assets/image-20260121212954223.png)\n\n![image-20260121213032590](./assets/image-20260121213032590.png)\n\n个人实测得最远单程飞行是 4 公里左右，不是图传断了，是电池没电了\n\n大疆的图传是双频 (2.4 Ghz + 5 Ghz) 的，似乎也只有博坦的图传是单频 (2.4 Ghz)。在干扰严重的城区，单 2.4 Ghz 劣势非常明显，和双频 O4 图传的 Mini 4 Pro 在同一地点起飞，同一地点遥控，Mini 4 Pro 能飞 6 公里以上并保持较清晰的图传，ATOM 2 只能飞 2 公里左右\n\n不过有遮挡环境本来也不适合拿遥控飞，博坦现在也有 4G 模块了，这不重要\n\n#### 相册快传\n\n应该是通过 WiFi 直连实现的，经常搜索不到飞机，不知道是不是我手机兼容性的问题，感觉不如读卡器\n\n## 电池、充电、续航\n\n### 飞机本体\n\n因为博坦在售的所有型号基本上都是同样的模具，电池理所应当都是通用的，充电管家也是\n\n难绷的是最低端的 ATOM SE 用的是 18650 电芯，比 ATOM 1 和 ATOM 2 的软包 2S 瑟福电芯还大一些\n\n![image-20260121213509371](./assets/image-20260121213509371.png)\n\n![image-20260121213525218](./assets/image-20260121213525218.png)\n\n标称最大飞行时间是 30 分钟，我实际飞行测得的最大飞行时间是 22 分钟左右\n\n![image-20260121213704695](./assets/image-20260121213704695.png)\n\n对于长续航电池续航向一小时靠近的大疆，博坦的续航完全不够看，官方也不推出长续航电池\n\n因此我觉得 ATOM 2S 的 4G 模块也比较幽默，因为还没飞出遥控信号能覆盖的距离，飞机就先没电了\n\n### 充电管家\n\n充电管家则是 DC 12V 5A 的，并没有 USB-C，侧面的 OUT 口能在连接了 DC 口的情况下以 5V 1A 放电，官方给出的使用场景是给遥控充电，为什么我不用 18W PD 而是 5W 给 5200 mAh 的遥控器充电？\n\n充电 \"管家\" 更像是一个多口充电器，除此之外没有任何功能，也不像大疆那样能给电池集电 (把 2 块 25% 电量的电池集到另一块 50% 电量的电池里，就得到一块满电的电池)\n\n也没有第三方厂商给博坦出配件，只能将就用了\n\n![img](./assets/O1CN01cRwwCW1hztKbqTujV_!!2215427204349.jpg)\n\n### 遥控\n\n遥控的续航倒是完全不用担心，2 颗 2600 mAh 的 18650 组成 5200 mAh，大疆普控默认的单 18650 还要用户手动改双电池\n\n## 遥控\n\n遥控是电位器摇杆，并不是很丝滑，精细操作比较困难\n\n另外，遥控和手机的连接部分是换过引脚定义的，普通的线用不了，必须买 25 一根的，略微抽象\n\n![image-20260121215826171](./assets/image-20260121215826171.png)\n\n遥控连接手机默认会给手机供电，没有选项可以关闭，大疆可以。不过充不进去电，最多维持手机不掉电，或者掉很少的电。因为遥控的电池也很大，所以不用担心\n\n### 屏控？\n\n其实我一直不清楚屏控有什么用，手机无论续航还是屏幕都强于所谓屏控。网上很多人说屏控是为了专注飞行，不会被电话和信息打断，手机不是有免打扰功能吗\n\n博坦也出屏控了。用的是什么方案，目前知之甚少。大疆似乎有高通 6 系和 855 还是 865，行业机还用过 RK3399\n\n## 飞行\n\n### 悬停、姿态\n\n个人觉得没什么问题，这东西似乎下限就不低，一些杂牌无人机用的光流都很稳，再加上现在杂牌也有 GPS 了\n\nATOM 2 的搜星比 Mini 4 Pro 快\n\n姿态也没什么问题，满杆下降的时候有些抖\n\n拉距 4 公里，拉高 800 米，穿过云，扛着 5 级风安全回来了，博坦是不是杂牌应该无需多言\n\n![Screenshot_2026-01-21-22-08-42-88_e2a7d7fb1b9bf302e6463a9f12c5b3e7](./assets/Screenshot_2026-01-21-22-08-42-88_e2a7d7fb1b9bf302e6463a9f12c5b3e7.jpg)\n\n### 限高、限飞、合规\n\n据说 ATOM 1 的老固件是没有限飞的，如今做大了也要考虑合规问题。感叹还是小作坊下料猛，网上一搜就是很多标榜 800 米的杂牌机\n\n博坦没有解禁功能，不像大疆 UOM 批准之后可以临时解禁\n\n不过这都不是问题，很好解决，只是限高 800 米是飞机端限制的\n\n大疆在非限制区 (现在大疆没有限制区了，只有禁飞区) 的最大飞行高度是 500 米，博坦是 800 米，不过飞高了也没什么可拍的，对穿云倒是有点帮助\n\n写这篇文章的时候才发现，博坦官网把最大飞行高度改成了 120 米\n\n![image-20260121221441370](./assets/image-20260121221441370.png)\n\n关于合规，国内应该主要靠 \"飞行数据动态上报\" 来报送飞行数据，就是 HTTP 请求一个 CAAC 的 API 报送一些数据。DJI Fly 在设置里似乎可以关掉这个，博坦的国内版 APP 默认不能，不过这也不是问题，很好解决\n\n日本、美国似乎旅游似乎都要求单独注册无人机，主要通过 Remote ID 来监管无人机，Remote ID 可以通过 WiFi 和蓝牙发送，是公开不加密的，能够通过特定的设备接收 (甚至手机)。比较惊喜的是博坦做了这个，当定位在日本或者美国的时候，Potensic Eve 会显示导入 Remote ID 的选项\n\n### 视觉定位\n\n博坦只有下视觉 (摄像头光流 + ToF 测距)，对比大疆全向视觉有一个很直观的例子\n\n![image-20260121222719026](./assets/image-20260121222719026.png)\n\n从一栋楼的室内窗口飞出，飞出瞬间下视觉失效，此时博坦进入姿态模式，直到搜到 GNSS 信号，大疆的全向视觉还能正常通过周边建筑定位\n\n所以我不怎么敢阳台起飞\n\n### 避障？\n\n没有避障。我感觉避障只在使用跟随功能或者一键运镜的时候有用，我并不用这些功能\n\n手动飞的时候观察周边环境难道不是必须的吗\n\n## 拍摄\n\n### 照片\n\n照片默认拍摄 1200 万像素 (JPG、JPG + RAW)，切换到 8K 模式可以在 4:3 比例下拍摄 4800 万像素 JPG (没有 RAW)\n\n8K 模式下写卡很慢，拍一张要等 3 - 4 秒\n\n### 录像\n\n录像最高可以录制 4K 30 帧视频，每 4GB 会截断一次，应该是为了对 FAT 格式的兼容，大疆也会\n\n### 云台\n\n因为云台结构的问题，在 -90 度俯仰的情况下满杆前进云台会归位到 -80 度，Mini 4 Pro 那种独立于机身的云台支架则不会\n\n### 画质？\n\n朋友圈级别\n\n## 总结\n\nATOM 2 是我少有的买完没有后悔的东西，这句话应该足够当作总结\n\n如果博坦推出中高端机型，我大概会优先考虑博坦而不是大疆的","data":{"title":"Potensic Atom 2 体验","pubDate":"2026-01-21T00:00:00.000Z","category":"默认分类"}},{"slug":"first-time-experiencing-mercari","body":"很早以前就注册过几个海淘平台，包括已经跑路的魔法集市 (Masadora)，不过因为并没有太想买的东西，以及对运费的恐惧，一直没有下手\n\n然后就是去年，在 Amazon 买了一套 MementoMori 的 CD\n\n![image-20260117224428914](./assets/image-20260117224428914.png)\n\nDHL 直邮国内，非常快，印象里发货之后 3 天就到了，运费也不算贵，按照今天的汇率，大概是 56 CNY\n\n回归正题。我一直没有卡包，或者说钱包，出门的时候，所有证件就放在一个有拉链的小袋子里，感觉不是很方便，而且不怎么漂亮，于是想买一个钱包\n\n不知怎么，又想到贴吧看到过闪彩的钱包，长这样\n\n![img](https://shop.r10s.jp/book/cabinet/3848/9784299053848_2.jpg)\n\n于是就想买了\n\n这是杂志附送的，大概没有单独卖，只能上 Mercari 了。手机里还留着日淘任意门的 APP，于是搜索下单\n\n![Screenshot_2026-01-17-22-52-58-45_b28e9674c43e2d201a8c09d5cc9de69a](./assets/Screenshot_2026-01-17-22-52-58-45_b28e9674c43e2d201a8c09d5cc9de69a.jpg)\n\n总计是 2136 JPY (≈ 100 CNY，这些日淘 APP 实际价格都比显示的汇率贵一点) + 610 JPY (≈ 30 CNY) 运费，总共 130 CNY，用了微信支付的立减金 30 CNY，相当于到手 100 CNY 左右。据说有国内现货的时候更便宜\n\n每家海淘 APP 基本都有自己的物流线路，比传统 EMS、DHL 之类的都便宜。任意门的叫做竹蜻蜓。刚开始物流选项里没有竹蜻蜓，只有特别贵的 EMS 和海运，发工单之后被添加了竹蜻蜓选项。选的是竹蜻蜓专线，国内外都是中通承运\n\n然后就是漫长的等待\n\n|    日期    |          事件           |\n| :--------: | :---------------------: |\n| 2025-12-23 |          下单           |\n| 2025-12-23 |        卖家发货         |\n| 2025-12-25 |       转运仓入库        |\n| 2025-12-25 |     申请竹蜻蜓专线      |\n| 2025-12-28 |     竹蜻蜓审核通过      |\n| 2025-12-28 |     国际物流待发货      |\n| 2026-01-02 |      国际物流出库       |\n| 2026-01-06 |      国际物流揽收       |\n| 2026-01-07 | 空运航班起飞 (日本东京) |\n| 2026-01-07 | 空运航班落地 (中国天津) |\n| 2026-01-07 |        等待清关         |\n| 2026-01-09 |        清关放行         |\n| 2026-01-15 |      国内物流出库       |\n| 2026-01-15 |      国内物流揽收       |\n| 2026-01-17 |          收货           |\n\n总计 26 天。用时最长的环境居然是等国内物流揽收，据说是元旦之后物流有堆积\n\n期间又想要去年发行的闪彩 28 colors CD，在日亚看了下，加上运费要 300 CNY +，于是又在另一个日淘软件乐淘一番下单\n\n![Screenshot_2026-01-17-23-08-42-72_127792a843f45adf893c225e79235451](./assets/Screenshot_2026-01-17-23-08-42-72_127792a843f45adf893c225e79235451.jpg)\n\n忘记原价是多少了，总之砍价到了 4000 JPY，再加上新人优惠券 - 500 JPY，到手是 3500 JPY (≈ 163 CNY)\n\n本来还有一家 3700 JPY 的，不过一直提示下单失败，于是换了这家\n\n然后又是漫长的等待\n\n|    时间    |          事件           |\n| :--------: | :---------------------: |\n| 2025-12-26 |          下单           |\n| 2025-12-30 |       转运仓入库        |\n| 2025-12-30 |     转运仓等待上架      |\n| 2025-12-30 |      提交地址审核       |\n| 2025-12-30 |      地址审核通过       |\n| 2025-12-31 |       转运仓上架        |\n| 2025-12-31 |  申请纸飞机 Plus 专线   |\n| 2026-01-02 |        包装完成         |\n| 2026-01-02 |        支付运费         |\n| 2026-01-05 |      国际物流发货       |\n| 2026-01-09 |      国际物流揽收       |\n| 2026-01-09 | 到达空运机场 (日本东京) |\n| 2026-01-10 | 空运航班起飞 (日本东京) |\n| 2026-01-10 | 空运航班落地 (中国天津) |\n| 2026-01-12 |        等待清关         |\n| 2026-01-13 |        清关放行         |\n| 2026-01-13 |      国内物流出库       |\n| 2026-01-13 |      国内物流揽收       |\n| 2026-01-15 |          收货           |\n\n总计 21 天。纸飞机 Plus 专线国外不清楚承运公司，虽然海外段出库之后就有单号，但是到国内揽收之后才能查到，国内是顺丰承运\n\n纸飞机 Plus 专线会计体积重，这么点东西收了 120 CNY 的运费，问是否可以取消换线，答复可以，但需要支付 60 CNY 左右的包装费和手续费，无奈只能付款。品质也只能说一般，到手的时候 CD 已经从盒子里脱落了，所幸没有造成什么划痕\n\n又在 Amazon 下单了 2 套 CD，不过到现在还没有发货，还发来了延期交货的邮件，明明下单的时候显示有现货\n\n![image-20260117232802985](./assets/image-20260117232802985.png)\n\n不知道要等到什么时候？也许 3、4 月。可能等我忘记这件事的时候，快递就会出现在家门口","data":{"title":"Mercari 海淘转运初体验","pubDate":"2026-01-17T00:00:00.000Z","category":"默认分类"}},{"slug":"creating-headphone-frequency-response-curvues-and-autoeq","body":"AutoEq 项目提供了很多耳机的频响曲线文件，但如果你的耳机不在此列，也可以通过频响曲线的图片手搓频响曲线和适配 AutoEq\n\n频响曲线，就是下面图片这样的了。耳机的官网和商品详情页通常会有\n\n以刚到手的 [达音科 TITAN S2](https://www.dunu-topsound.com/titans2) 为例。下面的频响曲线图片里标了完整的刻度，所以操作起来会比较容易\n\n![img](https://static.wixstatic.com/media/258514_a885ad41b1784eb3bedb98b6d386ddda~mv2.jpg/v1/fill/w_1484,h_796,al_c,q_85,enc_avif,quality_auto/FR_JPG.jpg)\n\n先要将图片上的数据转换成数字，可以使用 [WebPlotDigitizer](https://apps.automeris.io/wpd4/) 这个工具。最新的版本是 V5，强制登录才可以使用，就用老版本 V4 了\n\n先点击右侧的 **Load Image** 载入频响曲线的图片\n\n![QQ_1742911452880](./assets/QQ_1742911452880.png)\n\n类型保持默认的 **2D (X-Y) Plot** 即可\n\n![QQ_1742911484794](./assets/QQ_1742911484794.png)\n\n下面需要在图片上标出 4 个点\n\n| 名称 |        作用         |\n| :--: | :-----------------: |\n|  X1  | 标记 X 轴有效值起点 |\n|  X2  | 标记 X 轴有效值终点 |\n|  Y1  | 标记 Y 轴有效值起点 |\n|  Y2  | 标记 Y 轴有效值终点 |\n\n频响曲线的 X 轴基本上都是 20 - 20kHz，这是人耳能听到的的频响范围\n\n因此，X1 放在 X 轴起点，X2 放在 X 轴终点。X1 和 X2 应尽量在同一水平线上\n\n![QQ_1742911695867](./assets/QQ_1742911695867.png)\n\nY 轴同理。Y1 放在 Y 轴有效值起点，Y2 放在放在 Y 轴的最大值就可以了。Y1 和 Y2 应尽量在同一垂直线上\n\n![QQ_1742911839519](./assets/QQ_1742911839519.png)\n\n标记完 4 个点后，点击右侧的 **Complete!**\n\n![QQ_1742911880888](./assets/QQ_1742911880888.png)\n\n在弹出对话框中输入 X1、X2、Y1、Y2 在图中对应的刻度。因为 X 轴的刻度分布是不均匀的，所以勾选 **Log Scale**\n\n![QQ_1742912032011](./assets/QQ_1742912032011.png)\n\n接下来，在右侧点击 Color 旁边的色块，选中曲线的颜色\n\n![QQ_1742912228624](./assets/QQ_1742912228624.png)\n\n![QQ_1742912284256](./assets/QQ_1742912284256.png)\n\n点击右侧的 **Run**\n\n![QQ_1742912296903](./assets/QQ_1742912296903.png)\n\n程序会自动标注曲线上的点。如果点 **数量太多、太少，或看起来不均匀**，则可以在左侧菜单运行 **Clear Data** 后调整参数，再次标注。或者通过右侧工具栏手动微调每一个点\n\n看起来自动标注的结果还不错\n\n![QQ_1742912326838](./assets/QQ_1742912326838.png)\n\n点击左侧菜单的 **View Data**。在弹出的对话框中设置 **按照 X 轴升序排序** 且 **保留小数点后 2 位**\n\n![QQ_1742912531231](./assets/QQ_1742912531231.png)\n\n点击 **Download .CSV** 导出曲线文件\n\n进入 [AutoEq 网站](https://autoeq.app/)。选择搜索框右侧的 **Open CSV file**，选择刚才保存的曲线文件\n\n![QQ_1742912629610](./assets/QQ_1742912629610.png)\n\n在左侧菜单选择目标曲线，AutoEq 就会自动调整均衡器来匹配目标曲线\n\n![QQ_1742912681993](./assets/QQ_1742912681993.png)\n\n例如 Harman IE 2019。可以在中间的图表看到调节前后的差别\n\n![QQ_1742912726811](./assets/QQ_1742912726811.png)\n\n在右侧选择使用的均衡器 App，就可以直接导出预设了\n\n![QQ_1742912760984](./assets/QQ_1742912760984.png)\n\n是否变好听就见仁见智了。不过如果操作是正确的，应该起码不会变难听","data":{"title":"手搓耳机频响曲线和适配 AutoEq","pubDate":"2025-03-25T00:00:00.000Z","category":"默认分类"}},{"slug":"hackergame-2024-writeup","body":"## 01. 签到 (Web)\n\n> 让我们说……各种语言，开始今年的冒险！\n\n打开网页，要求 60 秒内输入 12 种不同语言的启动\n\n![image-20241104115308544](./assets/image-20241104115308544.png)\n\n什么都不写，直接点提交后，URL 跳转到\n\n```\nhttp://202.38.93.141:12024/?pass=false\n```\n\n把 `pass` 字段直接改成 true，获得 flag\n\n![image-20241104115430854](./assets/image-20241104115430854.png)\n\n## 02. 喜欢做签到的 CTFer 你们好呀 (Web)\n\n> 喜欢做签到的 CTFer 你们好呀，我是一道更 **典型** 的 checkin：有两个 flag 就藏在中国科学技术大学校内 CTF 战队的招新主页里！\n\n没有给地址，所以要自己去找 \"中国科学技术大学校内 CTF 战队的招新主页\"\n\n在首页 (https://hack.lug.ustc.edu.cn/) 的承办单位中找到了战队名称及主页 (https://www.nebuu.la/)\n\n![image-20241104115707277](./assets/image-20241104115707277.png)\n\n进入网站后，有一个类似终端的页面\n\n![image-20241104115748441](./assets/image-20241104115748441.png)\n\n没有特别明显的线索，慢慢摸索\n\n一个 flag 用 `ls -al` 命令查看，是一个隐藏文件 `.flag`\n\n![image-20241104120033790](./assets/image-20241104120033790.png)\n\n还有一个 flag 在 `env` 命令中，是一个环境变量\n\n![image-20241104120149216](./assets/image-20241104120149216.png)\n\n## 03. 猫咪问答（Hackergame 十周年纪念版）(General)\n\n> 多年回答猫咪问答的猫咪大多目光锐利，极度自信，且智力逐年增加，最后完全变成猫咪问答高手。回答猫咪问答会优化身体结构，突破各种猫咪极限。猫咪一旦开始回答猫咪问答，就说明这只猫咪的智慧品行样貌通通都是上等，这辈子注定在猫咪界大有作为。\n\n### 01. 在 Hackergame 2015 比赛开始前一天晚上开展的赛前讲座是在哪个教室举行的？\n\n> 提示：填写教室编号，如 5207、3A101。\n\n2015 年举办的是第 2 届 Hackergame。不需要用到 Wayback Machine，官网就有存档 (https://lug.ustc.edu.cn/wiki/sec/contest.html)\n\n![image-20241104205914875](./assets/image-20241104205914875.png)\n\n在比赛时间安排中可以看到比赛前一天的讲座\n\n![image-20241104205954673](./assets/image-20241104205954673.png)\n\n答案是 **3A204**\n\n### 02. 众所周知，Hackergame 共约 25 道题目。近五年（不含今年）举办的 Hackergame 中，题目数量最接近这个数字的那一届比赛里有多少人注册参加？\n\n> 提示：是一个非负整数。\n\n往年的题目数量看看往年的题解\n\n近 5 年但不含今年，也就是 2019 - 2023\n\n| 年份 | 题目数量 |\n| :--: | :------: |\n| 2019 |    28    |\n| 2020 |    31    |\n| 2021 |    31    |\n| 2022 |    33    |\n| 2023 |    29    |\n\n2019 年最接近 25 题，查看 2019 年的新闻稿 (https://lug.ustc.edu.cn/news/2019/12/hackergame-2019/)\n\n> 经统计，在本次比赛中，总共有 2682 人注册...\n\n答案是 **2682**\n\n### 03. Hackergame 2018 让哪个热门检索词成为了科大图书馆当月热搜第一？\n\n> 提示：仅由中文汉字构成。\n\n查看 2018 年的猫咪问答题解 (https://github.com/ustclug/hackergame2018-writeups/blob/master/official/ustcquiz/README.md)\n\n其中\n\n> 1. 在中国科大图书馆中，有一本书叫做《程序员的自我修养:链接、装载与库》，请问它的索书号是？\n>\n>    打开 [中国科大图书馆主页](https://lib.ustc.edu.cn/)，直接搜索 \"程序员的自我修养\" 即可。\n\n答案是 **程序员的自我修养**\n\n### 04. 在今年的 USENIX Security 学术会议上中国科学技术大学发表了一篇关于电子邮件伪造攻击的论文，在论文中作者提出了 6 种攻击方法，并在多少个电子邮件服务提供商及客户端的组合上进行了实验？\n\n> 提示：是一个非负整数。\n\n论文地址是 https://www.usenix.org/conference/usenixsecurity24/presentation/ma-jinrui\n\n下载 PDF，懒得看，丢给 AI 分析\n\n> 在论文中作者提出了 6 种攻击方法，并在多少个电子邮件服务提供商及客户端的组合上进行了实验？答案是一个非负整数\n\n电子邮件服务提供商数量：16\n\n客户端数量：20\n\n组合数量：336\n\n答案是 **336**\n\n### 05. 10 月 18 日 Greg Kroah-Hartman 向 Linux 邮件列表提交的一个 patch 把大量开发者从 MAINTAINERS 文件中移除。这个 patch 被合并进 Linux mainline 的 commit id 是多少？\n\n> 提示：id 前 6 位，字母小写，如 c1e939。\n\n前段时间比较热门的话题，因此很好找\n\n进入 Linux 的 Github 仓库 (https://github.com/torvalds/linux/)\n\n在 commits 中搜索 Greg\n\n![image-20241104121801821](./assets/image-20241104121801821.png)\n\n找到这个典中典的 commit\n\n![image-20241104121821678](./assets/image-20241104121821678.png)\n\nID 为 6e90b675cf942e50c70e8394dfb5862975c3b3b2，前 6 位是 6e90b6\n\n答案是 **6e90b6**\n\n### 06. 大语言模型会把输入分解为一个一个的 token 后继续计算，请问这个网页的 HTML 源代码会被 Meta 的 Llama 3 70B 模型的 tokenizer 分解为多少个 token？\n\n> 提示：首次打开本页时的 HTML 源代码，答案是一个非负整数。\n\nGoogle 搜索 **Try Llama3 tokenizer online**，找到一个在线 playground (https://belladoreai.github.io/llama3-tokenizer-js/example-demo/build/)\n\n把 HTML 源码粘贴进去，得到 token 数\n\n![image-20241104211537041](./assets/image-20241104211537041.png)\n\n答案是 **1833**\n\n![image-20241104211623409](./assets/image-20241104211623409.png)\n\n## 04. 打不开的盒 (General)\n\n> 如果一块砖头里塞进了一张写了 flag 的纸条，应该怎么办呢？相信这不是一件困难的事情。\n>\n> 现在，你遇到了同样的情况：这里有一个密封盒子的设计文件，透过镂空的表面你看到里面有些东西……\n>\n> 那只要把它 3D 打印出来之后砸开不就解决了？用网上的制造服务的话，可能还没收到东西比赛就结束了，所以难道真的要去买一台 3D 打印机才能够看到里面的东西吗？\n\n下载到一个 STL 模型，用比较简单的 Autodesk Tinkercad (https://www.tinkercad.com/) 打开\n\n![image-20241104122303812](./assets/image-20241104122303812.png)\n\n2 种方式\n\n1. 把外形设置为透明\n2. 从洞里钻进去\n\n![image-20241104122409328](./assets/image-20241104122409328.png)\n\n## 05. 每日论文太多了! (General)\n\n> 描述太长不放了，大概意思就是看论文，找 flag\n\n论文地址是 https://dl.acm.org/doi/10.1145/3650212.3652145\n\n下载到 PDF 后，用 Foxit 编辑器 (不是查看器) 打开，搜索 flag\n\n![image-20241104122627242](./assets/image-20241104122627242.png)\n\n找到一个隐藏的 flag here，用编辑功能把这些文本和形状拖开，找到 flag\n\n![image-20241104122711374](./assets/image-20241104122711374.png)\n\n## 06. 比大小王 (Web)\n\n> 「小孩哥，你干了什么？竟然能一边原崩绝鸣舟，一边农瓦 CSGO。你不去做作业，我等如何排位上分？」\n>\n> 小孩哥不禁莞尔，淡然道：「很简单，做完口算题，拿下比大小王，家长不就让我玩游戏了？」\n>\n> 说罢，小孩哥的气息终于不再掩饰，一百道题，十秒速通。\n>\n> 在这场巅峰对决中，你能否逆风翻盘狙击小孩哥，捍卫我方尊严，成为新一代的「比大小王」？！\n\n类似前段时间比较火的小猿口算。*接口也是口，算法也是算*\n\n![image-20241104123057071](./assets/image-20241104123057071.png)\n\n经过测试，用模拟点击太慢了，是做不出来的...\n\n所以瞎写了一个篡改猴脚本，直接拦截请求\n\n```js\n// ==UserScript==\n// @name         比大小王 Solver\n// @namespace    http://tampermonkey.net/\n// @version      1.0\n// @description  比大小王 Solver\n// @match        http://202.38.93.141:12122/*\n// @run-at       document-start\n// @grant        unsafeWindow\n// ==/UserScript==\n\n(function () {\n    const originFetch = fetch;\n    unsafeWindow.fetch = (path, param) => {\n        console.log('fetch path', path);\n        if (path == '/game') {\n\t\t\tconsole.log('fetch game found', path);\n            return originFetch(path, param).then(response => {\n                const clone = response.clone();\n                clone.json().then(data => {\n                    console.log(\"fetch return:\", data);\n\n                    const challengs = data.values;\n                    console.log(\"challengs:\", challengs);\n\n                    const inputs = [];\n\n                    challengs.forEach(pair => {\n                        if (pair[0] > pair[1]) {\n                            inputs.push('>');\n                        } else if (pair[0] \u003c pair[1]) {\n                            inputs.push('\u003c');\n                        } else {\n                            inputs.push('=');\n                        }\n                    });\n\n                    setTimeout(() => {\n                        originFetch('submit', {\n                            method: 'POST',\n                            headers: {\n                                'Content-Type': 'application/json',\n                            },\n                            body: JSON.stringify({inputs}),\n                        }).then(response => {\n                            const clone = response.clone();\n                            clone.json().then(data => {\n                                console.log('flag:', data);\n                                alert(data.message);\n                            });\n                        });\n                    }, 5000);\n\n                    console.log('solution:', { inputs });\n                }).catch(error => {\n                    console.error(\"cannot parse fetch data:\", error);\n                });\n                return response;\n            });\n        } else {\n            return originFetch(path, param);\n        }\n    }\n})();\n```\n\n![image-20241104123237348](./assets/image-20241104123237348.png)\n\n## 07. 旅行照片 (General)\n\n### 01. 题目 1-2\n\n#### **问题 1: 照片拍摄的位置距离中科大的哪个校门更近？（格式：**`X校区Y门`**，均为一个汉字）**\n\n在地图上搜索 \"科里科气科创驿站\"，有 2 个结果，查看街景确认具体位置\n\n![image-20241104140159749](./assets/image-20241104140159749.png)\n\n离这里最近的校区是东校区，百度地图没有给具体校门，左西右东盲猜西门\n\n答案是 **东校区西门**\n\n#### **问题 2: 话说 Leo 酱上次出现在桁架上是……科大今年的 ACG 音乐会？活动日期我没记错的话是？（格式：**`YYYYMMDD`**）**\n\n微博搜索 **中科大leo学生动漫协会** (https://weibo.com/u/3671005600)，往下翻动态\n\n![image-20241104140413595](./assets/image-20241104140413595.png)\n\n答案是: **20240519**\n\n![image-20241104140524384](./assets/image-20241104140524384.png)\n\n### 02. 题目 3-4\n\n#### **问题 3: 这个公园的名称是什么？（不需要填写公园所在市区等信息）**\n\n把图片右侧的垃圾桶放大，可以看到 **六安国科** 字样\n\n![image-20241104141841515](./assets/image-20241104141841515.png)\n\n猜测位于安徽六安，打开高德搜索一下\n\n![Screenshot_2024-11-04-14-19-17-33_ca6ee20236ea15ad01663c6ea4ca0bdb](./assets/Screenshot_2024-11-04-14-19-17-33_ca6ee20236ea15ad01663c6ea4ca0bdb.jpg)\n\n公园特征不太明显，只能先试试了。不过第 1 个就蒙对了，答案是 **中央公园**\n\n#### **问题 4: 这个景观所在的景点的名字是？（三个汉字）**\n\n这题用 Google 或者百度识图就能找到\n\n![image-20241104142717792](./assets/image-20241104142717792.png)\n\n答案是 **坛子岭**\n\n![image-20241104142813611](./assets/image-20241104142813611.png)\n\n### 03. 题目 5-6\n\n#### **问题 5: 距离拍摄地最近的医院是？（无需包含院区、地名信息，格式：XXX医院）**\n\n图片中间的 2 栋建筑特征比较明显的，直接 Google 就能搜出来\n\n![image-20241104143950803](./assets/image-20241104143950803.png)\n\n![image-20241104144003030](./assets/image-20241104144003030.png)\n\n一开始以为 **动车所** 是繁体中文的某种表达，后来才知道就叫动车所\n\n![Screenshot_2024-11-04-14-41-54-73_ca6ee20236ea15ad01663c6ea4ca0bdb](./assets/Screenshot_2024-11-04-14-41-54-73_ca6ee20236ea15ad01663c6ea4ca0bdb.jpg)\n\n搜索北京北动车所附近的医院，最近的是 **积水潭医院**\n\n#### **问题 6: 左下角的动车组型号是？**\n\n这里也能用 Google 搜出来\n\n![image-20241104144441216](./assets/image-20241104144441216.png)\n\n搜出来的型号是 **CRH6F-A**。特征都可以对上，也确实是四编组动车\n\n![image-20241104144517367](./assets/image-20241104144517367.png)\n\n![image-20241104144554828](./assets/image-20241104144554828.png)\n\n## 10. Node.js is Web Scale (Web)\n\n> 小 Q 最近在写 Node.js，需要一个键值数据库来存储数据。\n>\n> ~~众所周知~~，其他的数据库无论如何都需要 write to disk，所以它们 don't scale。直接写到 `/dev/null` 嘛，虽然性能很好，但是好像就拿不到写入的数据了。基于这个想法，小 Q 利用最新最热的~~还没跑路的~~大语言模型，生成了一段内存数据库的 Node.js 代码，绝对 web scale！\n\n并没有用到 MongoDB 或者 Redis 之类的 KV 数据库，只是单纯在内存里存了 Json 对象\n\n源码中有一段执行命令的接口\n\n```js\n// GET /execute - Run commands which are constant and obviously safe.\napp.get(\"/execute\", (req, res) => {\n  const key = req.query.cmd;\n  const cmd = cmds[key];\n  res.setHeader(\"content-type\", \"text/plain\");\n  res.send(execSync(cmd).toString());\n});\n```\n\n但是这个接口只能执行 `cmds` 对象里的命令，而 `cmds` 命令是写死的，肯定没法往里面插入命令了\n\n```js\nlet cmds = {\n  getsource: \"cat server.js\",\n  test: \"echo 'hello, world!'\",\n};\n```\n\n搜索一下，发现有一种 **JavaScript 原型污染** 方式。具体原理懒得复制粘贴了\n\n总之就是，通过设置 `__proto__.XXX` 属性，可以让一个对象全局可用\n\n![image-20241104134121280](./assets/image-20241104134121280.png)\n\n设置完后，执行刚才插入的 `shell` 命令\n\n```\nhttps://XXX.hack-challenge.lug.ustc.edu.cn:8443/execute?cmd=shell\n```\n\n![image-20241104134255691](./assets/image-20241104134255691.png)\n\n## 11. PaoluGPT (Web)\n\n> 在大语言模型时代，几乎每个人都在和大语言模型聊天。小 Q 也想找一个方便使用的 GPT 服务，所以在熟人推荐下，他注册了某个 GPT 服务，并且付了几块钱。只是出乎小 Q 意料的是，他才用了几天，服务商就跑路了！跑路的同时，服务商还公开了一些用户的聊天记录。小 Q 看着这些聊天记录，突然发现里面好像有 flag……\n\n进入页面，看到一堆聊天记录\n\n![image-20241104125029215](./assets/image-20241104125029215.png)\n\n随便写个脚本，遍历一下就出 flag 了 (脚本没保存，有空再贴)\n\n第二个 flag 肯定不在网页里了，题目提供了后端源码\n\n```python\n@app.route(\"/list\")\ndef list():\n    results = execute_query(\"select id, title from messages where shown = true\", fetch_all=True)\n    messages = [Message(m[0], m[1], None) for m in results]\n    return render_template(\"list.html\", messages=messages)\n\n@app.route(\"/view\")\ndef view():\n    conversation_id = request.args.get(\"conversation_id\")\n    results = execute_query(f\"select title, contents from messages where id = '{conversation_id}'\")\n    return render_template(\"view.html\", message=Message(None, results[0], results[1]))\n```\n\n```python\nimport sqlite3\n\ndef execute_query(s: str, fetch_all: bool = False):\n    conn = sqlite3.connect(\"file:/tmp/data.db?mode=ro\", uri=True)\n    cur = conn.cursor()\n    res = cur.execute(s)\n    if fetch_all:\n        return res.fetchall()\n    else:\n        return res.fetchone()\n```\n\n有 2 个 SQL 查询相关方法，看来是 SQL 注入了\n\n第 1 个 查询没有注入点，注入点应该在第 2 个查询的 `conversation_id`\n\n跑一下 Sqlmap\n\n```\nsqlmap --cookie \"session=***\" --url https://***.hack-challenge.lug.ustc.edu.cn:8443/view?conversation_id= --level=3 --risk=3 --batch --dump\n```\n\n会将 `messages` 表的数据转储到 CSV 文件，第 1 个和第 2 个隐藏的 flag 都在里面\n\n![image-20241104125608943](./assets/image-20241104125608943.png)\n\n不过，如果一开始就用 SQL 注入做，就能一把梭了\n\n## 12. 强大的正则表达式 (math)\n\n暂无\n\n## 13. 惜字如金 3.0 (math)\n\n> 惜字如金化指的是将一串文本中的部分字符删除，从而形成另一串文本的过程。该标准针对的是文本中所有由 52 个拉丁字母连续排布形成的序列，在下文中统称为「单词」。一个单词中除「`AEIOUaeiou`」外的 42 个字母被称作「辅音字母」。整个惜字如金化的过程按照以下两条原则对文本中的每个单词进行操作：\n>\n> - 第一原则（又称 creat 原则）：如单词最后一个字母为「`e`」或「`E`」，且该字母的上一个字母为辅音字母，则该字母予以删除。\n> - 第二原则（又称 referer 原则）：如单词中存在一串全部由完全相同（忽略大小写）的辅音字母组成的子串，则该子串仅保留第一个字母。\n>\n> 容易证明惜字如金化操作是幂等的：多次惜字如金化和一次惜字如金化的结果是相同的。\n\n### 01. 题目 A\n\n第 1 题不涉及什么 Key，用 VSCode 打开，照着报错改就行了\n\n```diff\ndiff --git \"a/.\\\\answer_a.py\" \"b/.\\\\answer_a_fixed.py\"\nindex ac4e031..c05e611 100644\n--- \"a/.\\\\answer_a.py\"\n+++ \"b/.\\\\answer_a_fixed.py\"\n@@ -1,78 +1,78 @@\n #!/usr/bin/python3                                                              \n                                                                                 \n-import atexit, bas64, flask, itertools, os, r                                 \n+import atexit, base64, flask, itertools, os, re                                 \n                                                                                 \n                                                                                 \n def crc(input: bytes) -> int:                                                   \n     poly, poly_degree = 'AaaaaaAaaaAAaaaaAAAAaaaAAAaAaAAAAaAAAaaAaaAaaAaaA', 48 \n-    asert len(poly) == poly_degree + 1 and poly[0] == poly[poly_degree] == 'A' \n-    flip = sum(['a', 'A'].index(poly[i + 1]) \u003c\u003c i for i in rang(poly_degree))  \n+    assert len(poly) == poly_degree + 1 and poly[0] == poly[poly_degree] == 'A' \n+    flip = sum(['a', 'A'].index(poly[i + 1]) \u003c\u003c i for i in range(poly_degree))  \n     digest = (1 \u003c\u003c poly_degree) - 1                                             \n     for b in input:                                                             \n         digest = digest ^ b                                                     \n-        for _ in rang(8):                                                      \n-            digest = (digest >> 1) ^ (flip if digest & 1 == 1 els 0)           \n+        for _ in range(8):                                                      \n+            digest = (digest >> 1) ^ (flip if digest & 1 == 1 else 0)           \n     return digest ^ (1 \u003c\u003c poly_degree) - 1                                      \n                                                                                 \n                                                                                 \n def hash(input: bytes) -> bytes:                                                \n     digest = crc(input)                                                         \n     u2, u1, u0 = 0xCb4EcdfD0A9F, 0xa9dec1C1b7A3, 0x60c4B0aAB4Bf                 \n-    asert (u2, u1, u0) == (223539323800223, 186774198532003, 106397893833919)  \n+    assert (u2, u1, u0) == (223539323800223, 186774198532003, 106397893833919)  \n     digest = (digest * (digest * u2 + u1) + u0) % (1 \u003c\u003c 48)                     \n-    return digest.to_bytes(48 // 8, 'litl')                                   \n+    return digest.to_bytes(48 // 8, 'little')                                   \n                                                                                 \n                                                                                 \n def xzrj(input: bytes) -> bytes:                                                \n     pat, repl = rb'([B-DF-HJ-NP-TV-Z])\\1*(E(?![A-Z]))?', rb'\\1'                 \n-    return r.sub(pat, repl, input, flags=r.IGNORECAS)                        \n+    return re.sub(pat, repl, input, flags=re.IGNORECASE)                        \n                                                                                 \n                                                                                 \n paths: list[bytes] = []                                                         \n                                                                                 \n xzrj_bytes: bytes = bytes()                                                     \n                                                                                 \n-with open(__fil__, 'rb') as f:                                                 \n+with open(__file__, 'rb') as f:                                                 \n     for row in f.read().splitlines():                                           \n         row = (row.rstrip() + b' ' * 80)[:80]                                   \n-        path = bas64.b85encod(hash(row)) + b'.txt'                            \n+        path = base64.b85encode(hash(row)) + b'.txt'                            \n         with open(path, 'wb') as pf:                                            \n-            pf.writ(row)                                                       \n-            paths.apend(path)                                                  \n+            pf.write(row)                                                       \n+            paths.append(path)                                                  \n             xzrj_bytes += xzrj(row) + b'\\r\\n'                                   \n                                                                                 \n     def clean():                                                                \n         for path in paths:                                                      \n             try:                                                                \n-                os.remov(path)                                                 \n-            except FileNotFoundEror:                                           \n-                pas                                                            \n+                os.remove(path)                                                 \n+            except FileNotFoundError:                                           \n+                pass                                                            \n                                                                                 \n     atexit.register(clean)                                                      \n                                                                                 \n                                                                                 \n-bp: flask.Blueprint = flask.Blueprint('answer_a', __nam__)                     \n+bp: flask.Blueprint = flask.Blueprint('answer_a', __name__)                     \n                                                                                 \n                                                                                 \n @bp.get('/answer_a.py')                                                         \n-def get() -> flask.Respons:                                                    \n-    return flask.Respons(xzrj_bytes, content_typ='text/plain; charset=UTF-8') \n+def get() -> flask.Response:                                                    \n+    return flask.Response(xzrj_bytes, content_type='text/plain; charset=UTF-8') \n                                                                                 \n                                                                                 \n @bp.post('/answer_a.py')                                                        \n-def post() -> flask.Respons:                                                   \n+def post() -> flask.Response:                                                   \n     wrong_hints = {}                                                            \n     req_lines = flask.request.get_data().splitlines()                           \n-    iter = enumerat(itertools.zip_longest(paths, req_lines), start=1)          \n+    iter = enumerate(itertools.zip_longest(paths, req_lines), start=1)          \n     for index, (path, req_row) in iter:                                         \n-        if path is Non:                                                        \n+        if path is None:                                                        \n             wrong_hints[index] = 'Too many lines for request data'              \n             break                                                               \n-        if req_row is Non:                                                     \n+        if req_row is None:                                                     \n             wrong_hints[index] = 'Too few lines for request data'               \n             continue                                                            \n         req_row_hash = hash(req_row)                                            \n-        req_row_path = bas64.b85encod(req_row_hash) + b'.txt'                 \n+        req_row_path = base64.b85encode(req_row_hash) + b'.txt'                 \n         if not os.path.exists(req_row_path):                                    \n             wrong_hints[index] = f'Unmatched hash ({req_row_hash.hex()})'       \n             continue                                                            \n@@ -91,7 +91,7 @@ def post() -> flask.Respons:\n     if wrong_hints:                                                             \n         return {'wrong_hints': wrong_hints}, 400                                \n     with open('answer_a.txt', 'rb') as af:                                      \n-        answer_flag = bas64.b85decod(af.read()).decod()                      \n+        answer_flag = base64.b85decode(af.read()).decode()                      \n         closing, opening = answer_flag[-1:], answer_flag[:5]                    \n-        asert closing == '}' and opening == 'flag{'                            \n+        assert closing == '}' and opening == 'flag{'                            \n         return {'answer_flag': answer_flag}, 200                                \n```\n\n![image-20241105083117373](./assets/image-20241105083117373.png)","data":{"title":"Hackergame 2024 部分 WriteUp","pubDate":"2024-11-13T00:00:00.000Z","category":"信息安全"}},{"slug":"bring-lineageos-to-lenovo-smart-display-8","body":"适配完大概一个月了，还是系统性记录一下，以免自己忘了，当然如果有人刷到这篇文章，希望能给你一些帮助\n\n文章不是线性的，可以一口气全部看完再上手\n\n从 0 到 1 很困难，不要放弃。*自助者天助*\n\n## 软硬件要求\n\n硬件当然是越强越好。为了刷机和调试方便，我是在 Windows 11 里开的 VMware 虚拟机，R7 5800X 16 线程全开 + 16GB 内存，从零开始跑一遍整包 OTA 大概 40-50 分钟 (没开 ccache，开了还能快一些)，考虑到虚拟机损耗，实体机跑起来应该能再快一些\n\n因为适配的 Android 8.1，源码并不大，一套内核 + LineageOS 源码编译完目录大小也不到 200G，好像 150G 都不到，加上系统占用，最少给 200G 就差不多了\n\n软件方面，因为 Android 8.1 还需要用到 Python 2，所以用的 Debian 11。Java 的话，是 OpenJDK 8\n\n最后，强烈建议把源码的改动存到 Git 上，如果嫌 Github 之类公网的麻烦，本地搭一个 Gitea 也不错，否则改动多了，自己都忘记改了什么\n\n对文章里描述不清，或者看不懂的部分，也 **请参考 commit [记录](https://github.com/lenovo-sparrow-dev/android_device_lenovo_sparrow/commits?author=azwhikaru)，源码在 [这里](https://github.com/orgs/lenovo-sparrow-dev/repositories)**\n\n## 准备内核源码\n\n这块可以随机应变下。联想官方虽然有给 Lenovo Smart Display 8 开源，但是源码是 Linux 3.10.X 的，机器上的内核版本实际上是 3.18.X。有人在联想官方论坛反馈，不过到现在也没有更新源码\n\n联想有一台相似的机子 (不敢说完全相同，因为拆机之后发现主板丝印实际上是不一样的) 叫做 ThinkSmart View，这台机子开出的源码是 3.18.X 的，因此把它的[源码](https://github.com/lenovo-sparrow-dev/android_kernel_lenovo_apq8053) 借过来用\n\n如果你想给没有开源内核的机子编译内核，可以找找有没有相似的机子，然后补一下 dts、驱动、参数试试。实在不行也可以试试 prebuilt 内核，据说 LineageOS 对这块没什么要求，之前看见过一个红米的机子用 prebuilt 内核\n\n## 适配 device\n\n这块是最复杂的，几乎找不到教程，~~唯一~~ 的方法是抄别人的 device\n\n不是我说的，LineageOS 官方的 [FAQ](https://wiki.lineageos.org/faq#where-are-guides-so-i-can-port-lineageos-to-my-unsupported-device) 就是这么说的\n\n> ## Where are guides so I can port LineageOS to my unsupported device?\n>\n> - There are none\n> - See what other, similar devices did to get them to work.\n\n### 提取 vendor proprrietary\n\n就是提取设备官方系统中的 vendor 专有部分，例如摄像头、麦克风、网卡等设备的驱动，例如一些 so 库。这些可能是不开源的，别担心，就连你的设备制造商也没有这些源码，它们也是把第三方厂商提供的成品文件加进 SDK 里编译的\n\n这一步要做的是找出哪些属于设备专有的 blobs，这里可以从相同 SoC 的设备的 device 里抄到，如果找不到，退而求其次，找相同版本的同平台设备。当然即使有相同的 SoC，主板也是不同的，例如它们可能使用不同的摄像头、麦克风，不过通常能提取到最基础的 blobs，足以支持系统启动，在进入系统后遇到摄像头打不开之类的问题，再抓 Log 看看是缺少什么驱动\n\n装好 adb，连接设备，然后找一个与你设备相似的 device。例如这里我找到了联想 P2 的，也是联想的，也是骁龙 625，也是 Android 8.1\n\n![image-20240827210507182](./assets/ba31da4d902079db540068aeba2cad68.png)\n\n打开 proprietary-files.txt，这就是设备专有 blobs 的列表了\n\n![image-20240827210653694](./assets/53f7fa0cb991be6565c7828b9dba943d.png)\n\n打开 device 下的 extract-files.sh，运行这个脚本，就会通过 adb 从设备中提取 blobs 了。在运行之前，修改其中的 DEVICE 和 VENDOR\n\n```\nDEVICE=kuntao\nVENDOR=lenovo\n```\n\n因为也是联想的，所以这里 VENDOR 就不改了。DEVICE 改成正确的设备代号，比如 sparrow，这样提取的文件就会存在源码目录下的 vendor/lenovo/sparrow\n\n运行 extract-files.sh，因为是借用别的设备的，列表肯定有出入。遇见 File not found 之类的报错，说明你设备的 firmware 里并没有这个文件，在  proprietary-files.txt 删掉那行。部分带 hash 的提示 Miss match，把 hash 删掉，直到运行 extract-files.sh 可以不报错跑完\n\n剩下的主要靠自己判断了：哪些要删，哪些要加\n\n最后运行 device 下的 setup-makefiles.sh，会在 vendor/lenovo/sparrow 下生成 Makefile，这样 vendor device 就准备好了\n\n### 修改 device\n\n修改同 SoC 设备的 device 里的参数，例如分区大小、Kernel 参数等。可以参考一下这个 [commit](https://github.com/lenovo-sparrow-dev/android_device_lenovo_sparrow/commit/ff098a1d8f3a744031345af3ffae41d946816559)\n\n不要一口气抄太多，特别是自己也不理解的参数就别加了。首先需要保证源码可以跑起来，能够生成 OTA Package 和镜像，再考虑修 Bug\n\n完整的 commit 记录可以参考 [这里](https://github.com/lenovo-sparrow-dev/android_device_lenovo_sparrow/commits?author=azwhikaru)\n\n## 开始编译\n\n准备好 device 后，回到源码目录执行\n\n```\nsource build/envsetup.sh\n```\n\n然后 lunch 选中我们的 device 和构建变体\n\n```\nlunch lenovo_sparrow-eng\n```\n\n使用 eng 变体是为了默认开启 adb 和一些调试功能，要注意选了 eng 就不能用 brunch 了， brunch 会默认选择 userdebug 构建\n\n使用 otapackage 选项构建 eng\n\n```\nmake otapackage -j16\n```\n\n也可以单独构建想要的镜像，例如\n\n```\nmake systemimage\n```\n\n## 报错\n\n准备好 device、vendor proprrietary、kernel，理论上现在就可以开始编译了，但是编译 **不可能** 一次通过。受到各种软件版本的影响，即使是网上搜到的解决方法有时也不那么有用，会看报错至关重要，并且要试着 **去看源码**\n\n下面记录一些自己遇到并解决的问题\n\n### Zygote 不启动\n\n> 32 位 device 改 64 位时没有修改 core_base.mk 成 core_64_bit.mk 导致\n\n参考 [commit](https://github.com/lenovo-sparrow-dev/android_device_lenovo_sparrow/commit/ff098a1d8f3a744031345af3ffae41d946816559#diff-ba5890c0b164cad304ef7d7d89476fc4e8465f1625898b7f05a890e1a089de6e)\n\n原 device 为 32 位，修改为 64 位后编译，开机停留在 bootanimation，伴随报错，修改回 32 位后编译正常启动\n\n```\nCould not create image space with image file '/system/framework/boot.art'. Attempting to fall back to imageless running. Error was: Cannot relocate image /system/framework/boot.art to : Only the zygote can create the global boot image.\n```\n\n在源码中搜索 `Could not create image space with image file`，这个报错出现在 `art/runtime/gc/space/image_space.cc` 的 `LoadBootImage` 函数中\n\n```c\nerror = true;\nLOG(ERROR) \u003c\u003c \"Could not create image space with image file '\" \u003c\u003c image_file_name \u003c\u003c \"'. \"\n  \u003c\u003c \"Attempting to fall back to imageless running. Error was: \" \u003c\u003c error_msg\n  \u003c\u003c \"\\nAttempted image: \" \u003c\u003c image_name;\nbreak;\n```\n\n`error_msg` 变量是通过对 `CreateBootImage` 函数的调用得到的\n\n```c\nstd::unique_ptr\u003cspace::ImageSpace> boot_image_space_uptr = CreateBootImage(\n        image_name.c_str(),\n        image_instruction_set,\n        index > 0,\n        &error_msg);\n```\n\n关键在最后一句 `Only the zygote can create the global boot image.`\n\n在源码中搜索，这个报错同样出现在 `art/runtime/gc/space/image_space.cc`\n\n```c\nstatic bool ImageCreationAllowed(bool is_global_cache,\n                                 const InstructionSet isa,\n                                 std::string* error_msg) {\n  // Anyone can write into a \"local\" cache.\n  if (!is_global_cache) {\n    return true;\n  }\n\n  // Only the zygote running as root is allowed to create the global boot image.\n  // If the zygote is running as non-root (and cannot write to the dalvik-cache),\n  // then image creation is not allowed..\n  if (Runtime::Current()->IsZygote()) {\n    return CanWriteToDalvikCache(isa);\n  }\n\n  *error_msg = \"Only the zygote can create the global boot image.\";\n  return false;\n}\n```\n\n报错是因为当前 Runtime 并不是 Zygote 导致的，换句话说就是没有 Zygote 进程\n\n> Zygote 是 Android 系统创建新进程的核心进程，负责启动 Dalvik 虚拟机，加载一些必要的系统资源和系统类，启动 system_server 进程，随后进入等待处理 app 应用请求\n>\n> (以上这段话摘自网络，被引用次数太多，出处未知)\n\n![4322319cfe0cd30ac51b055d13023f2d](./assets/4322319cfe0cd30ac51b055d13023f2d.png)\n\nDalvik 起不来，Android 自然也无法启动\n\n![image-20240721010915233](./assets/59c47c281d47a05c60d54fdb400433df.png)\n\nAndroid 的系统服务和框架都是要运行在 Android Runtime 也就是 Dalvik 虚拟机上的，虚拟机无法启动，则任何 Android 的服务都无法启动\n\nZygote 服务由 rootdir 下的 `init.zygote*.rc` 定义，在 `init.rc` 中被调用\n\n```\nimport /init.${ro.zygote}.rc\n```\n\n从 Android 5 开始，Android 支持了 64 位，因此 Zygote 也做了 32 和 64 位的区分\n\nZygote 有如下 4 种模式，也就是 `ro.zygote` 可以有如下 4 个值\n\n1. zygote32: 纯 32 位模式\n2. zygote64: 纯 64 位模式\n3. zygote32_64: 32 位模式为主，64 位模式为辅 (secondary)。即 **系统框架是 32 位**，但也支持 64 位的应用\n4. zygote64_32: 64 位模式为主，32 位模式为辅 (secondary)。即 **系统框架是 64 位**，但也支持 32 位的应用\n\n显然针对一般的 64 位设备，zygote64_32 用得比较多\n\n以下是一段默认的 `init.zygote32.rc`，Zygote 服务的可执行文件是 `/system/bin/app_process`\n\n```\nservice zygote /system/bin/app_process -Xzygote /system/bin --zygote --start-system-server\n    class main\n    priority -20\n    user root\n    group root readproc\n    socket zygote stream 660 root system\n    onrestart write /sys/android_power/request_state wake\n    onrestart write /sys/power/state on\n    onrestart restart audioserver\n    onrestart restart cameraserver\n    onrestart restart media\n    onrestart restart netd\n    onrestart restart wificond\n    writepid /dev/cpuset/foreground/tasks\n```\n\n以下是一段默认的 `init.zygote64_32.rc`。除了 `/system/bin/app_process64` 的 64 位 Zygote，还定义了一个名为 `zygote_secondary` 的 32 位 Zygote\n\n```\nservice zygote /system/bin/app_process64 -Xzygote /system/bin --zygote --start-system-server --socket-name=zygote\n    class main\n    priority -20\n    user root\n    group root readproc\n    socket zygote stream 660 root system\n    onrestart write /sys/android_power/request_state wake\n    onrestart write /sys/power/state on\n    onrestart restart audioserver\n    onrestart restart cameraserver\n    onrestart restart media\n    onrestart restart netd\n    onrestart restart wificond\n    writepid /dev/cpuset/foreground/tasks\n\nservice zygote_secondary /system/bin/app_process32 -Xzygote /system/bin --zygote --socket-name=zygote_secondary --enable-lazy-preload\n    class main\n    priority -20\n    user root\n    group root readproc\n    socket zygote_secondary stream 660 root system\n    onrestart restart zygote\n    writepid /dev/cpuset/foreground/tasks\n```\n\nZygote 服务在 `init.rc` 中是这样被调用的\n\n```\n# It is recommended to put unnecessary data/ initialization from post-fs-data\n# to start-zygote in device's init.rc to unblock zygote start.\non zygote-start && property:ro.crypto.state=unencrypted\n    # A/B update verifier that marks a successful boot.\n    exec_start update_verifier_nonencrypted\n    start netd\n    start zygote\n    start zygote_secondary\n\non zygote-start && property:ro.crypto.state=unsupported\n    # A/B update verifier that marks a successful boot.\n    exec_start update_verifier_nonencrypted\n    start netd\n    start zygote\n    start zygote_secondary\n\non zygote-start && property:ro.crypto.state=encrypted && property:ro.crypto.type=file\n    # A/B update verifier that marks a successful boot.\n    exec_start update_verifier_nonencrypted\n    start netd\n    start zygote\n    start zygote_secondary\n```\n\n再看 `init.rc` 中对 `zygote-start` 的定义，启动 Zygote 的条件是挂载/解密 /data 后\n\n```\n# Now we can mount /data. File encryption requires keymaster to decrypt\n# /data, which in turn can only be loaded when system properties are present.\ntrigger post-fs-data\n\n# Now we can start zygote for devices with file based encryption\ntrigger zygote-start\n```\n\n看完了 Zygote 启动需要的条件，回到 device 上\n\n**用 getprop 一看当前设备的 `ro.zygote` 值，居然还是 `zygote32`，怪不得启动不了 64 位系统**\n\n如果直接在 device 的 Makefile 里覆盖 `ro.zygote` 属性，会出现报错 \"cannot assign to readonly variable\"\n\n这是因为这个属性并不需要手动指定，它已经定义在 `build/make/target/product` 下的 Makefile 中指定，并在 device 中 include\n\n检查 device，发现了对 `build/make/target/product` 下的 Makefile 的引用\n\n```makefile\n$(call inherit-product, $(SRC_TARGET_DIR)/product/core_base.mk)\n```\n\n查看 `core_base.mk`，其又引用了 `core_minimal.mk`，其中定义了\n\n```makefile\nPRODUCT_DEFAULT_PROPERTY_OVERRIDES += \\\n    ro.zygote=zygote32\nPRODUCT_COPY_FILES += \\\n    system/core/rootdir/init.zygote32.rc:root/init.zygote32.rc\n```\n\n再查看同一目录下的 `core_64_bit.mk`\n\n```makefile\n# Copy the 64-bit primary, 32-bit secondary zygote startup script\nPRODUCT_COPY_FILES += system/core/rootdir/init.zygote64_32.rc:root/init.zygote64_32.rc\n\n# Set the zygote property to select the 64-bit primary, 32-bit secondary script\n# This line must be parsed before the one in core_minimal.mk\nPRODUCT_DEFAULT_PROPERTY_OVERRIDES += ro.zygote=zygote64_32\n```\n\n问题解决，只需要把 device 中对 `core_base.mk` 的引用改成 `core_64_bit.mk` 即可\n\n### 提前装载分区\n\n> Google 在 Project Treble 中加入的特性\n\n参考 [commit](https://github.com/lenovo-sparrow-dev/android_device_lenovo_sparrow/commit/f72c18050a3e499c5c6e06541b50d652972bcb90)\n\n给这台机子适配 LineageOS 的时候需要原机的分区表，提取了 `/vendor/etc/fstab.qcom`\n\n```\n# Android fstab file.\n# The filesystem that contains the filesystem checker binary (typically /system) cannot\n# specify MF_CHECK, and must come before any filesystems that do specify MF_CHECK\n\n#TODO: Add 'check' as fs_mgr_flags with data partition.\n# Currently we dont have e2fsck compiled. So fs check would failed.\n\n#\u003csrc>                                      \u003cmnt_point>  \u003ctype>  \u003cmnt_flags and options>                     \u003cfs_mgr_flags>\n#/dev/block/bootdevice/by-name/system        /system      ext4    ro,barrier=1,discard                        wait,verify\n/dev/block/bootdevice/by-name/userdata      /data        ext4    noatime,nosuid,nodev,barrier=1,noauto_da_alloc,discard  wait,forceencrypt=footer,quota\n/devices/soc/7864900.sdhci/mmc_host*        /storage/sdcard1 vfat  nosuid,nodev         wait,voldmanaged=sdcard1:auto,noemulatedsd,encryptable=footer\n/devices/soc/7000000.ssusb/7000000.dwc3/xhci-hcd.0.auto*  /storage/usbotg  vfat  nosuid,nodev  wait,voldmanaged=usbotg:auto\n/dev/block/bootdevice/by-name/config        /frp         emmc    defaults                                    defaults\n/dev/block/bootdevice/by-name/misc          /misc        emmc    defaults                                    defaults\n/dev/block/bootdevice/by-name/cache         /cache       ext4    noatime,nosuid,nodev,barrier=1              wait\n/dev/block/bootdevice/by-name/modem         /firmware    vfat    ro,shortname=lower,uid=1000,gid=1000,dmask=227,fmask=337,context=u:object_r:firmware_file:s0 wait\n/dev/block/bootdevice/by-name/dsp           /dsp         ext4    ro,nosuid,nodev,barrier=1                   wait\n```\n\n原机 fstab 中的 `/system` 是被注释掉的，甚至没有 `/vendor`，那为什么开机后还是能挂载这两个分区？\n\n> msm8953_64:/ # df -h\n> Filesystem            Size  Used Avail Use% Mounted on\n> rootfs                840M  2.7M  838M   1% /\n> tmpfs                 880M  712K  879M   1% /dev\n> /dev/block/mmcblk0p48 1.2G  1.1G  131M  90% /system\n> /dev/block/mmcblk0p45 477M  432M   45M  91% /vendor\n> tmpfs                 880M     0  880M   0% /mnt\n> /dev/block/mmcblk0p46  93M  420K   92M   1% /cache\n> /dev/block/mmcblk0p1   84M   27M   57M  33% /firmware\n> /dev/block/mmcblk0p12  12M  8.1M  3.5M  70% /dsp\n> /dev/block/mmcblk0p47  27M  324K   27M   2% /persist\n> /dev/block/dm-0       4.2G  952M  3.3G  22% /data\n> /data/media           4.2G  952M  3.3G  22% /mnt/runtime/default/emulated\n\n在 Google 的文档里发现了对这个问题的解释：[提前装载分区 | Android Open Source Project](https://source.android.com/docs/core/architecture/kernel/mounting-partitions-early) (中文翻译得不是那么准确，还是建议看英文的)\n\n> 支持 Treble 的设备必须启用第一阶段装载，以确保 `init` 可以加载分布在 `system` 和 `vendor` 分区的 [安全增强型 (SELinux)](https://source.android.com/docs/security/features/selinux?hl=zh-cn) 政策 Fragment。此访问权限还可实现在内核启动后尽快加载内核模块。\n>\n> 如需执行提前装载，Android 必须有权访问模块所在的文件系统。Android 8.0 及更高版本支持在 `init` 的第一阶段（即初始化 SElinux 之前）装载 `/system`、`/vendor` 或 `/odm`。\n\nTreble 部分就不再详细介绍了，简单来说就是将 Android 系统本身与硬件供应商的代码隔离，并提供了一个统一的接口供 Android 访问硬件供应商部分代码，从此开发者就只需要更新 Android 系统本身，并通过统一接口连接 Android 和硬件供应商部分代码\n\n> 在 Android 9 及更低版本中，设备可以使用 [设备树叠加层 (DTO)](https://source.android.com/docs/core/architecture/dto?hl=zh-cn) 为提前装载的分区指定 `fstab` 条目\n\n也就是说，当前 `/system` 和 `/vendor` 的 fstab 是被定义在 Device Tree 中的，在 kernel 源码的 dts 中，如下\n\n```\nfirmware {\n\n\t\tandroid {\n\t\t\tcompatible = \"android,firmware\";\n\n\t\t\tfstab {\n\t\t\t\tcompatible = \"android,fstab\";\n\n\t\t\t\tvendor {\n\t\t\t\t\tcompatible = \"android,vendor\";\n\t\t\t\t\tdev = \"/dev/block/platform/soc/7824900.sdhci/by-name/vendor\";\n\t\t\t\t\ttype = \"ext4\";\n\t\t\t\t\tmnt_flags = \"ro,barrier=1,discard\";\n\t\t\t\t\tfsmgr_flags = \"wait\";\n\t\t\t\t\tstatus = \"ok\";\n\t\t\t\t};\n\n\t\t\t\tsystem {\n\t\t\t\t\tcompatible = \"android,system\";\n\t\t\t\t\tdev = \"/dev/block/platform/soc/7824900.sdhci/by-name/system\";\n\t\t\t\t\ttype = \"ext4\";\n\t\t\t\t\tmnt_flags = \"ro,barrier=1,discard\";\n\t\t\t\t\tfsmgr_flags = \"wait\";\n\t\t\t\t\tstatus = \"ok\";\n\t\t\t\t};\n\t\t\t};\n\t\t};\n\t};\n```\n\n这就解释了为什么 fstab 中没有 `/system` 和 `/vendor`，却依旧可以正常挂载这两个分区\n\n### Data 加解密\n\n> 全盘加密是在 Android 4.4 版中引入的，不过 Android 5.0 中又引入了以下新功能\n>\n> - 新增了快速加密方式，这种加密方式只会对数据分区中已使用的分块进行加密，以免首次启动用时过长。目前只有 EXT4 和 F2FS 文件系统支持快速加密。\n> - 添加了 [`forceencrypt` fstab 标记](https://source.android.com/docs/core/storage/config?hl=zh-cn)，以便在首次启动时进行加密。\n> - 添加了对解锁图案和无密码加密的支持。\n> - 添加了由硬件支持的加密密钥存储空间，该空间使用可信执行环境（TEE，例如 TrustZone）的签名功能。如需了解详情，请参阅 [存储已加密的密钥](https://source.android.com/docs/security/encryption/full-disk?hl=zh-cn#storing_the_encrypted_key)。\n\n最后关闭了自动加密，参考 [commit](https://github.com/lenovo-sparrow-dev/android_device_lenovo_sparrow/commit/389f413994c8182c411d5bbe660953312352f4a2)\n\n为了启用硬件加密，需要在 device 里加入如下配置\n\n- BoardConfig.mk\n\n\t```makefile\n\t# Encryption\n\tTARGET_HW_DISK_ENCRYPTION := true\n\tTARGET_LEGACY_HW_DISK_ENCRYPTION := true\n\tTARGET_CRYPTFS_HW_PATH := vendor/qcom/opensource/cryptfs_hw\n\t```\n\n\t其中 `TARGET_CRYPTFS_HW_PATH` 需要指向高通的 `cryptfs_hw` 模块\n\n- device.mk\n\n\t```makefile\n\t# HW crypto\n\tPRODUCT_PACKAGES += \\\n\t    vendor.qti.hardware.cryptfshw@1.0-service-qti.qsee\n\t```\n\n- proprietary-files.txt\n\n\t```\n\t# DRM and SEE\n\tvendor/bin/qseecomd\n\tvendor/lib/libQSEEComAPI.so\n\tvendor/lib64/libQSEEComAPI.so\n\tvendor/lib/libdiag.so\n\tvendor/lib64/libdiag.so\n\tvendor/lib/libdrmfs.so\n\tvendor/lib64/libdrmfs.so\n\tvendor/lib/libdrmtime.so\n\tvendor/lib64/libdrmtime.so\n\tvendor/lib/librpmb.so\n\tvendor/lib64/librpmb.so\n\tvendor/lib/libssd.so\n\tvendor/lib64/libssd.so\n\tvendor/lib/libsecureui.so\n\tvendor/lib64/libsecureui.so\n\tvendor/lib/libqisl.so\n\tvendor/lib64/libqisl.so\n\tvendor/lib/libGPreqcancel.so\n\tvendor/lib64/libGPreqcancel.so\n\tvendor/lib/libStDrvInt.so\n\tvendor/lib64/libStDrvInt.so\n\tvendor/lib/libGPreqcancel_svc.so\n\tvendor/lib64/libGPreqcancel_svc.so\n\tvendor/lib/libsecureui_svcsock.so\n\tvendor/lib64/libsecureui_svcsock.so\n\t```\n\n\t除此之外，还需要 `qseecomd` 及其依赖\n\n在添加完加解密所需的依赖后，还需要在 `fstab.qcom` 分区表中设置哪些分区可以被加密\n\n在需要加密的分区的 `fs_mgr_flags` 字段里添加 flag，可以是如下值\n\n- `forceencrypt` 当前分区未加密，但要求在首次启动后强制加密\n- `encryptable` 当前分区未加密，用户可以在设置中手动为其加密\n\n### 不装载 /data\n\n> fstab 分区表有误导致\n\n这个问题卡了很久，期间一直没找对关键 Log，记录下自己走的弯路\n\n表现为设置强制加密 `forceencrypt` 后，开机 vold 和 qseecomd 均可以启动，但不调用 `CryptFS` 开始加密 /data，系统也不会继续启动 Zygote\n\n去除强制加密后，故障依旧，可以挂载 /data，/data 有文件释放，但系统并无进一步动作\n\n还记得前面分析 [Zygote 启动流程](#Zygote 不启动) 的 init.rc 时，有一个属性叫做 `ro.crypto.state`，当这个属性被设置时，Zygote 才会启动\n\n这个属性共有 3 种状态\n\n- unencrypted: **已解密**\n- unsupported: **不支持加密 (未启用)**\n- encrypted: **已加密，这里是结合 FBE 使用**\n\n```\n# It is recommended to put unnecessary data/ initialization from post-fs-data\n# to start-zygote in device's init.rc to unblock zygote start.\non zygote-start && property:ro.crypto.state=unencrypted\n    # A/B update verifier that marks a successful boot.\n    exec_start update_verifier_nonencrypted\n    start netd\n    start zygote\n    start zygote_secondary\n\non zygote-start && property:ro.crypto.state=unsupported\n    # A/B update verifier that marks a successful boot.\n    exec_start update_verifier_nonencrypted\n    start netd\n    start zygote\n    start zygote_secondary\n\non zygote-start && property:ro.crypto.state=encrypted && property:ro.crypto.type=file\n    # A/B update verifier that marks a successful boot.\n    exec_start update_verifier_nonencrypted\n    start netd\n    start zygote\n    start zygote_secondary\n```\n\n运行 `getprop ro.crypto.state`，发现现在没有这个属性，那 `ro.crypto.state` 的值是谁设置的？\n\n在源码中搜索，发现 `/system/core/init/builtins.cpp` 中有对这个属性进行 `property_set`\n\n![image-20240724231922891](./assets/68f2fa8028d1be3cda6645a6bff128a4.png)\n\n进入 `queue_fs_event()` 函数\n\n```cpp\n/* Queue event based on fs_mgr return code.\n *\n * code: return code of fs_mgr_mount_all\n *\n * This function might request a reboot, in which case it will\n * not return.\n *\n * return code is processed based on input code\n */\n\nstatic int queue_fs_event(int code) {\n    int ret = code;\n    \n    if (code == FS_MGR_MNTALL_DEV_NEEDS_ENCRYPTION) { // 分区强制加密，但当前未加密 (forceencrypt)\n        ActionManager::GetInstance().QueueEventTrigger(\"encrypt\"); // 触发 encrypt，在 init.*.rc 里，后面会说\n    } else if (code == FS_MGR_MNTALL_DEV_MIGHT_BE_ENCRYPTED) { // 分区可能已经加密，加密类型为 block\n        property_set(\"ro.crypto.state\", \"encrypted\");\n        property_set(\"ro.crypto.type\", \"block\");\n        ActionManager::GetInstance().QueueEventTrigger(\"defaultcrypto\"); // 触发 defaultcrypto\n    } else if (code == FS_MGR_MNTALL_DEV_NOT_ENCRYPTED) { // 分区未加密 (encryptable)\n        property_set(\"ro.crypto.state\", \"unencrypted\");\n        ActionManager::GetInstance().QueueEventTrigger(\"nonencrypted\"); // 触发 nonencrypted\n    } else if (code == FS_MGR_MNTALL_DEV_NOT_ENCRYPTABLE) { // 分区不支持加密\n        property_set(\"ro.crypto.state\", \"unsupported\");\n        ActionManager::GetInstance().QueueEventTrigger(\"nonencrypted\"); // 触发 nonencrypted\n    } else if (code == FS_MGR_MNTALL_DEV_NEEDS_RECOVERY) {\n        /* Setup a wipe via recovery, and reboot into recovery */\n        PLOG(ERROR) \u003c\u003c \"fs_mgr_mount_all suggested recovery, so wiping data via recovery.\";\n        const std::vector\u003cstd::string> options = {\"--wipe_data\", \"--reason=fs_mgr_mount_all\" };\n        reboot_into_recovery(options);\n        return 0;\n        /* If reboot worked, there is no return. */\n    } else if (code == FS_MGR_MNTALL_DEV_FILE_ENCRYPTED) {\n        if (e4crypt_install_keyring()) {\n            return -1;\n        }\n        property_set(\"ro.crypto.state\", \"encrypted\");\n        property_set(\"ro.crypto.type\", \"file\");\n\n        // Although encrypted, we have device key, so we do not need to\n        // do anything different from the nonencrypted case.\n        ActionManager::GetInstance().QueueEventTrigger(\"nonencrypted\");\n    } else if (code == FS_MGR_MNTALL_DEV_IS_METADATA_ENCRYPTED) {\n        if (e4crypt_install_keyring()) {\n            return -1;\n        }\n        property_set(\"ro.crypto.state\", \"encrypted\");\n        property_set(\"ro.crypto.type\", \"file\");\n\n        // defaultcrypto detects file/block encryption. init flow is same for each.\n        ActionManager::GetInstance().QueueEventTrigger(\"defaultcrypto\");\n    } else if (code == FS_MGR_MNTALL_DEV_NEEDS_METADATA_ENCRYPTION) {\n        if (e4crypt_install_keyring()) {\n            return -1;\n        }\n        property_set(\"ro.crypto.type\", \"file\");\n\n        // encrypt detects file/block encryption. init flow is same for each.\n        ActionManager::GetInstance().QueueEventTrigger(\"encrypt\");\n    } else if (code > 0) {\n        PLOG(ERROR) \u003c\u003c \"fs_mgr_mount_all returned unexpected error \" \u003c\u003c code;\n    }\n    /* else ... \u003c 0: error */\n\n    return ret;\n}\n```\n\n函数通过几个 if 判断来设置 `ro.crypto.state`\n\n下面是两种常见的情况\n\n- FS_MGR_MNTALL_DEV_NEEDS_ENCRYPTION: **分区强制加密，但当前未加密 (fs_mgr_tag 含有 forceencrypt)**\n- FS_MGR_MNTALL_DEV_NOT_ENCRYPTED: **分区未加密 (fs_mgr_tag 含有 encryptable)**\n\n显然，当我们配置强制加密的时候，需要得到的返回值是 FS_MGR_MNTALL_DEV_NEEDS_ENCRYPTION\n\n如果不加密，则是 FS_MGR_MNTALL_DEV_NOT_ENCRYPTED\n\n函数前面的注释写道\n\n> return code of fs_mgr_mount_all\n\n即通过 `fs_mgr_mount_all()` 函数的返回值，来确定 `ro.crypto.type`\n\
